<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김비서</title>
<meta name="description" content="음성으로 관리하는 나만의 일정·메모·D-day 비서">
<meta name="theme-color" content="#FFFFFF">
<meta name="app-build-version" content="v9.4-cal-tap">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script>window.APP_BUILD = 'v9.4-cal-tap';</script>
<style>
:root{
  --deep:#0F2419; --yellow:#FFEB3B; --lgreen:#A5D6A7; --orange:#F57F17;
  --bg:#F2F4F3; --card:#FFFFFF; --cell:#F6F7F7; --text:#191C1B; --sub:#6E7773; --line:#E5E8E7;
  --sun:#E5484D; --sat:#3E7BFA; --accent:#22223B;
  --ev-bg:#E6F4EA; --ev-tx:#1D5B33; --ev-dot:#34A853;
  --mm-bg:#FFF5D1; --mm-tx:#755800; --mm-dot:#F2B600;
  --dd-bg:#FFE9DA; --dd-tx:#9A4300; --dd-dot:#F57F17;
  --shadow:0 1px 2px rgba(16,24,20,.04),0 4px 16px rgba(16,24,20,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1311; --card:#171D1A; --cell:#1D2421; --text:#E9EEEB; --sub:#97A39D; --line:#2A3330;
    --sun:#FF7B7F; --sat:#7AA5FF; --accent:#FFD166;
    --ev-bg:#1E3527; --ev-tx:#A8DDB5; --mm-bg:#3A3215; --mm-tx:#F3D77A; --dd-bg:#3E2814; --dd-tx:#FFC08F;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1311; --card:#171D1A; --cell:#1D2421; --text:#E9EEEB; --sub:#97A39D; --line:#2A3330;
  --sun:#FF7B7F; --sat:#7AA5FF; --accent:#FFD166;
  --ev-bg:#1E3527; --ev-tx:#A8DDB5; --mm-bg:#3A3215; --mm-tx:#F3D77A; --dd-bg:#3E2814; --dd-tx:#FFC08F;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:15px;letter-spacing:-.2px;
  -webkit-tap-highlight-color:transparent;padding-bottom:calc(140px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1200px;margin:0 auto;height:60px;padding:0 16px;display:flex;align-items:center;gap:10px}
.top .brand{margin:0 18px 0 0;line-height:0;color:var(--text);flex:none}
.top .brand svg{height:36px;width:auto;display:block}
.top nav{display:none;height:100%;gap:4px}
.top nav button{background:none;border:0;padding:0 14px;height:100%;font-size:15px;color:var(--sub);font-weight:600;border-bottom:2px solid transparent}
.top nav button.on{color:var(--text);border-bottom-color:var(--text)}
.top .today{margin-left:auto;font-size:13px;color:var(--sub);white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);background:none;border:0;padding:4px 6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.sync.ok i{background:var(--ev-dot)} .sync.busy i{background:var(--mm-dot)} .sync.err i{background:var(--sun)}
@media (max-width:640px){ .top .today{display:none} .sync{margin-left:auto} }
.aibox{background:var(--ev-bg);color:var(--ev-tx);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-weight:600;line-height:1.5}
.find-sec{font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 8px}
.icon-btn{background:var(--cell);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--text)}
@media (min-width:900px){ .top nav{display:flex} }

.wrap{max-width:1200px;margin:0 auto;padding:16px}
.panel{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
@media (max-width:640px){ .wrap{padding:12px} .panel{padding:14px;border-radius:16px} }
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.phead h2{display:inline;margin:0 10px 0 0;font-size:20px;font-weight:800}
.psub{color:var(--sub);font-size:13px}
.mnav{display:flex;align-items:center;gap:8px}
.mnav b{font-size:17px;min-width:104px;text-align:center}
.muted{color:var(--sub);font-size:13px}
.empty{color:var(--sub);text-align:center;padding:26px 8px;font-size:14px;line-height:1.6}

/* 필터 칩 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px 6px 8px;font-size:14px;font-weight:600;color:var(--sub)}
.fchip .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:#fff}
.fchip .box .ico{width:14px;height:14px;stroke-width:3}
.fchip.on{color:var(--text)}
.fchip.f-event.on{border-color:var(--ev-dot);background:var(--ev-bg)} .fchip.f-event.on .box{background:var(--ev-dot);border-color:var(--ev-dot)}
.fchip.f-memo.on{border-color:var(--mm-dot);background:var(--mm-bg)} .fchip.f-memo.on .box{background:var(--mm-dot);border-color:var(--mm-dot)}
.fchip.f-dday.on{border-color:var(--dd-dot);background:var(--dd-bg)} .fchip.f-dday.on .box{background:var(--dd-dot);border-color:var(--dd-dot)}
.seg{display:inline-flex;background:var(--cell);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* 달력 */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:980px){ .cal-layout{grid-template-columns:minmax(0,1fr) 300px} }
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:13px;font-weight:700;padding:2px 8px 4px;color:var(--sub)}
.cal .dow.sun{color:var(--sun)} .cal .dow.sat{color:var(--sat)}
.cell{min-height:118px;background:var(--cell);border:1.5px solid transparent;border-radius:12px;padding:8px;overflow:hidden;cursor:pointer;min-width:0}
.cell:hover{border-color:var(--line)}
.cell.other{background:transparent}
.cell.other .dn{opacity:.4}
.cell.sel{border-color:var(--text)}
.cell .dn{font-size:14px;font-weight:700;margin-bottom:4px}
.cell .dn span{display:inline-block;min-width:24px;padding:1px 5px;border-radius:6px;text-align:center}
.cell.today .dn span{background:var(--text);color:var(--card)}
.cell .dn.sun{color:var(--sun)} .cell .dn.sat{color:var(--sat)}
.cell .lun{font-size:11px;font-weight:500;font-style:normal;color:var(--sub);margin-left:4px}
@media (pointer: fine){ .pill[data-id]:hover{outline:1.5px solid currentColor;outline-offset:-1.5px} }
.pill{display:block;font-size:12px;font-weight:600;line-height:1.3;padding:3px 6px;border-radius:5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.ev{background:var(--ev-bg);color:var(--ev-tx)}
.pill.memo{background:var(--mm-bg);color:var(--mm-tx)}
.pill.dd{background:var(--dd-bg);color:var(--dd-tx)}
.cell .more{font-size:11px;color:var(--sub);margin-top:3px;padding-left:2px}
@media (max-width:640px){
  .cal{gap:3px}
  .cal .dow{padding:2px 0;text-align:center;font-size:12px}
  .cell{min-height:70px;padding:4px 3px;border-radius:8px}
  .cell .dn{font-size:12px;text-align:center;margin-bottom:2px}
  .cell .dn span{min-width:20px;padding:0 3px}
  .pill{font-size:10px;padding:1px 3px;border-radius:3px;margin-top:2px;letter-spacing:-.4px}
  .cell .more{font-size:10px;text-align:center;padding:0}
}

/* 오른쪽(폰은 아래) 날짜 패널 */
.side{background:var(--cell);border-radius:16px;padding:16px;align-self:start}
.side h3{margin:0 0 12px;font-size:16px;font-weight:800}
.side-sec{font-size:13px;font-weight:700;color:var(--sub);margin:18px 0 8px}
.scard{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border:1px solid transparent}
.scard:hover{border-color:var(--line)}
.scard{position:relative}
.sdel{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--sub);display:grid;place-items:center;cursor:pointer;padding:0}
.sdel:hover{background:var(--cell);color:var(--text)}
.sdel .ico{width:16px;height:16px}
.scard .st{padding-right:26px}
.scard .st{font-weight:700;display:flex;align-items:flex-start;gap:8px;word-break:break-all}
.scard .ss{font-size:13px;color:var(--sub);margin:4px 0 0 16px;white-space:pre-wrap;word-break:break-all;line-height:1.5}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;display:inline-block}
.dot.ev{background:var(--ev-dot)} .dot.memo{background:var(--mm-dot)} .dot.dd{background:var(--dd-dot)}

/* 공통 버튼·태그 */
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;margin-right:6px;vertical-align:1px}
.tag.ev{background:var(--ev-bg);color:var(--ev-tx)} .tag.memo{background:var(--mm-bg);color:var(--mm-tx)} .tag.dd{background:var(--dd-bg);color:var(--dd-tx)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.pri{background:var(--text);color:var(--card)}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.warn{background:transparent;color:var(--sun);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* 메모 */
.mcard{background:var(--cell);border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;gap:12px;cursor:pointer;border:1px solid transparent}
.mcard:hover{border-color:var(--line)}
.mcard.done{opacity:.5}
.mcard.done .mtext{text-decoration:line-through}
.mcard .mtext{white-space:pre-wrap;word-break:break-all;line-height:1.55}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--sub);background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
.chk .ico{width:14px;height:14px;stroke-width:3}
.chk.on{background:var(--ev-dot);border-color:var(--ev-dot)}

/* D-day */
.dd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dcard{background:var(--cell);border-radius:16px;padding:16px;cursor:pointer;border:1px solid transparent}
.dcard:hover{border-color:var(--line)}
.dcard .dk{font-size:12px;color:var(--sub);font-weight:600}
.dcard .t{font-weight:700;margin-top:2px}
.dcard .big{font-size:30px;font-weight:800;margin:8px 0 2px;letter-spacing:-.8px}
.dcard .nx{margin-top:10px;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* 찾기 */
.search{position:relative;margin-bottom:14px}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub)}
.search input{padding-left:40px;background:var(--cell);border-color:transparent}
mark{background:var(--yellow);color:#000;border-radius:3px;padding:0 1px}

/* 입력바 */
.ask{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:30;padding:8px 12px;background:linear-gradient(to top,var(--bg) 65%,transparent)}
.ask-in{max-width:1200px;margin:0 auto;display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;box-shadow:0 6px 20px rgba(16,24,20,.10)}
.ask-in input{border:0;padding:8px 0;background:transparent;flex:1;min-width:0}
.mic{flex:none;width:42px;height:42px;border-radius:12px;border:0;background:var(--cell);display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.mic.on{background:var(--orange);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.send{flex:none;height:42px;border-radius:12px;border:0;background:var(--text);color:var(--card);font-weight:700;padding:0 16px}
@media (min-width:900px){ .ask{bottom:0;padding-bottom:16px} body{padding-bottom:100px} }

/* 미리보기 */
.preview{position:fixed;left:0;right:0;bottom:calc(124px + env(safe-area-inset-bottom));z-index:31;padding:0 12px;display:none}
@media (min-width:900px){ .preview{bottom:80px} }
.preview.show{display:block}
.preview .pv{max-width:1200px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(16,24,20,.18)}
.pv .sum{font-size:16px;font-weight:700;margin:0 0 4px;word-break:break-all}
.pv .hint{font-size:12px;color:var(--orange);margin:4px 0 0}
.pv .row{margin-top:12px}

/* 하단 탭 (폰) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;padding:8px 0 8px;color:var(--sub);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--text)}
.tabs button.on .ico{stroke-width:2.2}
@media (min-width:900px){ .tabs{display:none} }

/* 모달 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.4);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 14px;font-size:18px;font-weight:800}
.sheet .sec{background:var(--cell);border-radius:12px;padding:14px;margin-bottom:10px}
.sheet .sec h3{margin:0 0 8px;font-size:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px;font-weight:600}
.toast{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;font-weight:600;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}
.undo-btn{margin-left:10px;background:transparent;color:inherit;border:1.5px solid currentColor;border-radius:8px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
.vgate{position:fixed;inset:0;z-index:55;background:rgba(10,14,12,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;font-weight:700;font-size:18px}
.vgate button{width:168px;height:168px;border-radius:50%;border:0;background:#FFD166;color:#22223B;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.vgate button .ico{width:72px;height:72px;stroke-width:1.6}
/* PC 작은 창 모드 (마우스 기기에서 창 폭 560px 미만) */
body.mini .tabs, body.mini #topNav, body.mini .top .today{display:none}
body.mini .top-in{height:52px;padding:0 12px}
body.mini .top .brand svg{height:30px}
body.mini .sync{margin-left:auto}
body.mini .wrap{padding:10px 12px}
body.mini .ask{bottom:0;padding-bottom:12px}
body.mini .preview{bottom:76px}
body.mini{padding-bottom:96px}
.mini-sec{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.mini-h{font-size:13px;font-weight:800;margin-bottom:6px;display:flex;gap:6px;align-items:baseline}
.mini-h.today{color:var(--text)} .mini-h .muted{font-weight:500}
.mini-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;cursor:pointer;border-top:1px solid var(--line)}
.mini-h + .mini-row{border-top:0}
.mini-row .t{flex:none;min-width:44px;font-size:12px;font-weight:700;color:var(--sub);padding-top:2px}
.mini-row .b{flex:1;min-width:0;font-size:14px;word-break:break-all}
.mini-row:hover .b{text-decoration:underline}
.mini-empty{font-size:13px;color:var(--sub);padding:4px 0}
/* 서랍 */
.gtot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.gtot div{background:var(--cell);border-radius:12px;padding:10px;text-align:center}
.gtot dt{font-size:12px;color:var(--sub);margin-bottom:2px} .gtot dd{margin:0;font-weight:800;font-size:14px;letter-spacing:-.4px}
.gin{color:var(--ev-tx)} .gout{color:var(--dd-tx)}
.gperson{background:var(--cell);border-radius:12px;margin-bottom:6px;overflow:hidden}
.gperson .gh{display:flex;gap:8px;align-items:center;padding:11px 14px;cursor:pointer}
.gperson .gh b{flex:1;min-width:0;word-break:break-all}
.gperson .gh span{font-size:13px;white-space:nowrap}
.gperson .gbody{padding:0 14px 10px}
.gline{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.gline .m{flex:1;color:var(--sub);font-size:13px}
.refcard{background:var(--cell);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.refcard h4{margin:0 0 6px;font-size:15px} .refcard .rb{white-space:pre-wrap;line-height:1.55;font-size:14px}
.linkbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--cell);border-radius:12px;padding:14px;margin-bottom:8px;text-decoration:none;color:var(--text);font-weight:700}
.linkbtn small{color:var(--sub);font-weight:500;word-break:break-all}
.hidden{display:none!important}
</style>
</head>

<script>
'use strict';
/* =========================================================
   김비서 v1 — 화면 뼈대 + 이 기기 저장(localStorage)
   다음 단계: Supabase 동기화 · Claude 해석 · 아침 알림
   ========================================================= */

// ---------- 저장 (이 기기 + 로그인하면 서버 동기화) ----------
const STORE_KEY = 'kbs_data_v1';
let DB = loadDB();
function loadDB(){
  try{
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if(d && Array.isArray(d.items)){ if(!Array.isArray(d.dirty)) d.dirty = []; return d; }
  }catch(e){}
  return {ver:1, items:[], dirty:[], lastPull:null, syncUser:null};
}
function saveDB(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch(e){ toast('저장 실패 — 저장 공간을 확인해 주세요'); }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function markDirty(id){ if(!DB.dirty.includes(id)) DB.dirty.push(id); }
function upsert(item){
  item.updated = Date.now();
  const i = DB.items.findIndex(x => x.id === item.id);
  if(i >= 0) DB.items[i] = item; else { item.created = item.created || Date.now(); DB.items.push(item); }
  markDirty(item.id); saveDB(); render(); syncSoon();
}
// 삭제 = 지움 표시만 남김(다른 기기에도 지워지게)
function removeItem(id){
  const x = DB.items.find(i => i.id === id); if(!x) return;
  Object.keys(x).forEach(k => { if(!['id','type','created'].includes(k)) delete x[k]; });
  x.deleted = true; x.updated = Date.now();
  markDirty(id); saveDB(); render(); syncSoon();
}
// 확인창 대신: 바로 지우고 6초 동안 [되돌리기]
let undoT = null;
function quickDelete(id){
  const x = DB.items.find(i => i.id === id); if(!x) return;
  const backup = JSON.parse(JSON.stringify(x));
  removeItem(id);
  const t = document.getElementById('toast');
  t.innerHTML = '삭제했어요 <button class="undo-btn" onclick="undoDelete()">되돌리기</button>';
  t.classList.add('show');
  window._undoItem = backup;
  clearTimeout(toastT); clearTimeout(undoT);
  undoT = setTimeout(() => { t.classList.remove('show'); window._undoItem = null; }, 6000);
}
function undoDelete(){
  const b = window._undoItem; if(!b) return;
  window._undoItem = null; clearTimeout(undoT);
  const x = DB.items.find(i => i.id === b.id);
  if(x){ Object.keys(x).forEach(k => delete x[k]); Object.assign(x, b); delete x.deleted; upsert(x); }
  toast('되돌렸어요');
}
const live   = () => DB.items.filter(x => !x.deleted);
const events = () => live().filter(x => x.type === 'event');
const memos  = () => live().filter(x => x.type === 'memo');
const ddays  = () => live().filter(x => x.type === 'dday');

// ---------- 날짜 도구 ----------
const DOW = ['일','월','화','수','목','금','토'];
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parseYmd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function todayYmd(){ return ymd(new Date()); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function dayDiff(a, b){ // b - a (일)
  const A = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  const B = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((B - A) / 86400000);
}
function fmtDate(s, withYear){
  const d = parseYmd(s);
  const y = (withYear || d.getFullYear() !== new Date().getFullYear()) ? d.getFullYear() + '년 ' : '';
  return y + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')';
}
function fmtTime(t){
  if(!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ap = h < 12 ? '오전' : '오후';
  const hh = h % 12 === 0 ? 12 : h % 12;
  return ap + ' ' + hh + '시' + (m ? ' ' + m + '분' : '');
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- 음력 ----------
const LUNAR = (typeof KoreanLunarCalendar === 'function') ? new KoreanLunarCalendar() : null;
function solarToLunar(s){ // 'YYYY-MM-DD' → {year, month, day, intercalation}
  if(!LUNAR) return null;
  const d = parseYmd(s);
  if(!LUNAR.setSolarDate(d.getFullYear(), d.getMonth()+1, d.getDate())) return null;
  return LUNAR.getLunarCalendar();
}
function lunarToSolar(y, m, d){ // 그해에 30일이 없는 달이면 29일로
  if(!LUNAR) return null;
  let ok = LUNAR.setLunarDate(y, m, d, false);
  if(!ok && d === 30) ok = LUNAR.setLunarDate(y, m, 29, false);
  if(!ok) return null;
  const c = LUNAR.getSolarCalendar();
  return new Date(c.year, c.month - 1, c.day);
}
function lunarLabel(s){ const l = solarToLunar(s); return l ? (l.intercalation ? '윤' : '') + l.month + '.' + l.day : ''; }
function ymdParts(s){ const [y, m, d] = String(s).split('-').map(Number); return {y, m, d}; }

// ---------- D-day 계산 ----------
// kind: since = 그날부터 N일째(1일부터 셈) / until = 그날까지 D-N / yearly = 매년 반복(lunar면 음력 날짜, noYear면 연도 모름)
// 매년 반복은 해마다 그해 양력 날짜를 새로 계산 (음력 기념일 포함)
function yearlyNext(x, from){
  const b = ymdParts(x.date);
  if(x.lunar){
    for(let y = from.getFullYear() - 1; y <= from.getFullYear() + 1; y++){
      const sd = lunarToSolar(y, b.m, b.d);
      if(sd && sd >= from) return sd;
    }
    return null;
  }
  let nx = new Date(from.getFullYear(), b.m - 1, b.d);
  if(nx < from) nx = new Date(from.getFullYear() + 1, b.m - 1, b.d);
  return nx;
}
function ddDateLabel(x){
  const b = ymdParts(x.date);
  if(x.kind === 'yearly') return (x.lunar ? '매년 음력 ' : '매년 양력 ') + b.m + '월 ' + b.d + '일' + (x.noYear ? '' : ' (' + b.y + '년부터)');
  return fmtDate(x.date, true);
}
function ddayInfo(x){
  const today = parseYmd(todayYmd());
  const base = parseYmd(x.date);
  if(x.kind === 'since'){
    const n = dayDiff(base, today) + 1;
    if(n < 1) return {big: 'D-' + (1 - n), sub: fmtDate(x.date, true) + ' 시작', soon: 1 - n, next: null};
    // 다음 기념: 100일 단위 또는 N주년 중 가까운 것
    const next100 = Math.ceil((n + (n % 100 === 0 ? 0 : 0)) / 100) * 100;
    const cand = [];
    const n100 = n % 100 === 0 ? n : next100;
    cand.push({label: n100 + '일', date: addDays(base, n100 - 1)});
    let yr = today.getFullYear() - base.getFullYear();
    let ann = new Date(base.getFullYear() + yr, base.getMonth(), base.getDate());
    if(ann < today) ann = new Date(base.getFullYear() + (++yr), base.getMonth(), base.getDate());
    if(yr >= 1) cand.push({label: yr + '주년', date: ann});
    cand.sort((a, b) => a.date - b.date);
    const nx = cand[0];
    const left = dayDiff(today, nx.date);
    return {big: n.toLocaleString() + '일째', sub: fmtDate(x.date, true) + ' 부터',
            next: nx.label + ' · ' + fmtDate(ymd(nx.date), true) + (left === 0 ? ' · 오늘!' : ' · D-' + left), soon: left};
  }
  if(x.kind === 'yearly'){
    const nx = yearlyNext(x, today);
    if(!nx) return {big: '—', sub: ddDateLabel(x), next: '음력 계산 범위 밖(2050년까지)', soon: null};
    const left = dayDiff(today, nx);
    const s = ymd(nx), lun = lunarLabel(s);
    const b = ymdParts(x.date);
    const yearOf = x.lunar ? ((solarToLunar(s) || {}).year || nx.getFullYear()) : nx.getFullYear();
    const times = x.noYear ? 0 : yearOf - b.y;
    return {big: left === 0 ? '오늘!' : 'D-' + left, sub: ddDateLabel(x),
            next: fmtDate(s, true) + (lun ? ' · 음 ' + lun : '') + (times > 0 ? ' · ' + times + '번째' : ''), soon: left};
  }
  // until
  const left = dayDiff(today, base);
  return {big: left === 0 ? 'D-DAY' : (left > 0 ? 'D-' + left : 'D+' + (-left)), sub: fmtDate(x.date, true), next: null, soon: left >= 0 ? left : 9999};
}

// ---------- 말 → 일정/메모 해석 (1단계: 규칙 기반, 2단계에서 Claude로 보강) ----------
const WD = {'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
function parseCommand(raw){
  let t = ' ' + raw.trim().replace(/\s+/g, ' ') + ' ';
  t = t.replace(/^\s*김비서(야|님|씨)?\s*[,.!]?\s+/, ' '); // 부르는 말 '김비서' 빼기
  const now = new Date(); const today = parseYmd(ymd(now));
  let date = null, time = null, notes = [];
  let intent = null;

  // 찾기 의도
  if(/(찾아\s*(줘|봐|주세요)?|검색해?\s*(줘)?|있었나|있었지|언제였지|뭐였지|뭐더라|어디였지|얼마\s*(받았|냈|했|줬|보냈)[가-힣]*|받았지|냈지|했었지)\s*[?？.]?\s*$/.test(t.trim())){
    intent = 'find';
  }
  // 메모 의도
  if(/메모\s*(해\s*줘|해줘|해 줘|좀|해)?|기억해\s*(줘)?|적어\s*(줘|둬)/.test(t)) intent = intent || 'memo';
  if(/(일정|스케(줄|쥴))/.test(t) && intent !== 'find') intent = 'event';

  const take = re => { const m = t.match(re); if(m){ t = t.replace(m[0], ' '); } return m; };
  let m;
  const repeatMonthly = intent !== 'find' && !!take(/매\s*(월|달)\s*/);
  // 음력·기념일 표시
  const isLunar = !!take(/음력\s*(으로|로)?/);
  const ddWord = intent !== 'find' && intent !== 'memo' ? (t.match(/생일|생신|기념일|사귄|태어난/) || [])[0] : null;
  let raw3 = null; // 숫자로 말한 날짜 그대로 {y, m, d, hasYear}

  // 날짜: 2026-10-16 / 2026.10.16 / 2026년 10월 16일
  if(m = take(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})\s*일?/)){
    date = new Date(+m[1], +m[2]-1, +m[3]);
    raw3 = {y: +m[1], m: +m[2], d: +m[3], hasYear: true};
  } else if(m = take(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/)){
    date = new Date(today.getFullYear(), +m[1]-1, +m[2]);
    raw3 = {y: today.getFullYear(), m: +m[1], d: +m[2], hasYear: false};
    if(!ddWord && !isLunar && dayDiff(date, today) > 60){ date.setFullYear(date.getFullYear()+1); notes.push('내년으로 이해'); }
  } else if(m = take(/(?:^|\s)(\d{1,2})\/(\d{1,2})(?=\s)/)){
    date = new Date(today.getFullYear(), +m[1]-1, +m[2]);
    if(dayDiff(date, today) > 60){ date.setFullYear(date.getFullYear()+1); notes.push('내년으로 이해'); }
  } else if(m = take(/(\d{1,3})\s*일\s*(뒤|후)에?/)){
    date = addDays(today, +m[1]);
  } else if(m = take(/(내일\s*모레|글피|모레|내일|오늘)/)){
    const k = m[1].replace(/\s/g,'');
    date = addDays(today, {'오늘':0,'내일':1,'모레':2,'내일모레':2,'글피':3}[k]);
  } else if(m = take(/(이번\s*주|다음\s*주|담\s*주|다다음\s*주)?\s*([월화수목금토일])\s*요일/)){
    const target = WD[m[2]];
    const w = (m[1] || '').replace(/\s/g,'');
    if(w){
      const mon = addDays(today, -((today.getDay() + 6) % 7)); // 이번 주 월요일
      const off = (target + 6) % 7; // 월=0 … 일=6
      const add = w === '이번주' ? 0 : (w === '다다음주' ? 14 : 7);
      date = addDays(mon, off + add);
    } else {
      let diff = (target - today.getDay() + 7) % 7;
      date = addDays(today, diff);
    }
  } else if(m = take(/(?:^|\s)(\d{1,2})\s*일(?=\s|에|날)/)){
    date = new Date(today.getFullYear(), today.getMonth(), +m[1]);
    if(date < today){ date = new Date(today.getFullYear(), today.getMonth()+1, +m[1]); notes.push('다음 달로 이해'); }
  }

  // 시간: 18:30 / 오후 3시 반 / 저녁 7시 20분 / 정오
  if(m = take(/(\d{1,2}):(\d{2})/)){
    time = pad(+m[1]) + ':' + m[2];
  } else if(m = take(/(오전|오후|아침|점심|저녁|밤|낮|새벽)?\s*(\d{1,2})\s*시(?!간)\s*(반|(\d{1,2})\s*분)?/)){
    let h = +m[2]; const mi = m[3] === '반' ? 30 : (m[4] ? +m[4] : 0);
    const ap = m[1] || '';
    if(/오후|저녁|밤|점심|낮/.test(ap) && h < 12) h += 12;
    if(/밤/.test(ap) && h === 24) h = 0;
    if(!ap && h >= 1 && h <= 7){ h += 12; notes.push('오후로 이해'); }
    time = pad(h % 24) + ':' + pad(mi);
  } else if(m = take(/정오/)){ time = '12:00'; }

  // 명령어 꼬리 정리
  let title = t
    .replace(/^\s*(메모|기억|적어)\s*(해|좀)?\s*(줘|둬|주세요)?\s*[:,]?\s+/,' ')
    .replace(/(을|를)?\s*(일정\s*(으로|에)?\s*)?(입력|추가|등록|저장|넣어|기록|잡아|메모|적어|기억)\s*(해|하)?\s*(줘|주세요|줄래|둬|놔|라)?\s*[.!?？]*\s*$/,' ')
    .replace(/(찾아\s*(줘|봐|주세요)?|검색해?\s*(줘)?|있었나|있었지|언제였지|뭐였지|뭐더라|어디였지|얼마\s*(받았|냈|했|줬|보냈)[가-힣]*|받았지|냈지|했었지)\s*[?？.]?\s*$/,' ')
    .replace(/(^|\s)(일정|스케줄|스케쥴|메모)(\s|$)/g,' ')
    .replace(/^\s*(에|에는|은|는)\s+/,' ')
    .replace(/\s(에|에는)\s/g,' ')
    .replace(/\s+/g,' ').trim();

  // 날짜 질문: "10월 22일 무슨 일정 있지?", "내일 뭐 있어?", "이번 주 일정 알려줘" → 그날(그 주) 일정 읽어 주기
  const askQ = !/(넣어|추가|등록|저장|잡아|기록|입력|적어|기억해)/.test(raw)
    && (/(무슨|뭔|어떤)\s*(일정|일|약속|거|게)|일정\s*(뭐|있|알려|말해|읽어|확인)|뭐\s*(있|해야)/.test(raw)
        || /(있어|있지|있나|있니|있냐|있었어|있었지|있었나|있던가|뭐야|뭐지|알려\s*(줘|줄래|주세요)|말해\s*(줘|줄래)|읽어\s*(줘|줄래))\s*[?？.]*\s*$/.test(raw.trim()));
  if(askQ && date) return {kind:'day', date: ymd(date)};
  const wk = raw.match(/(이번|다음|담|다다음)\s*주/);
  if(askQ && !date && wk){
    const mon = addDays(today, -((today.getDay() + 6) % 7));
    const w = wk[1];
    return {kind:'week', date: ymd(addDays(mon, w === '이번' ? 0 : w === '다다음' ? 14 : 7))};
  }
  if(intent === 'find') return {kind:'find', query: title || raw.trim()};
  // 경조사 기록: "홍길동 장례식 10만원 냈어", "김철수 결혼식 축의금 20만원 받았어"
  const gm = raw.match(/(\d+(?:[.,]\d+)?)\s*(만\s*원|만|원)/);
  if(gm && /(냈|줬|보냈|드렸|했어|했다|받았|들어왔)/.test(raw) && /(결혼|축의|장례|조문|부의|조의|부고|상가|돌잔치|돌\b|생일|경조)/.test(raw)){
    const n = parseFloat(gm[1].replace(',', '.'));
    const amount = Math.round(/만/.test(gm[2]) ? n * 10000 : n);
    const ev = /결혼|축의/.test(raw) ? '결혼식' : /장례|조문|부의|조의|부고|상가/.test(raw) ? '장례식' : /돌/.test(raw) ? '돌잔치' : /생일/.test(raw) ? '생일' : '기타';
    const nm = raw.replace(gm[0], ' ')
      .replace(/(결혼식|결혼|축의금|축의|장례식장?|장례|조문|부의금|부의|조의금|조의|부고|상가|돌잔치|생일|경조사비?|경조금)(에|에서|으로|로)?/g, ' ')
      .replace(/(을|를)?\s*(냈|줬|보냈|드렸|했|받았|들어왔)\S*/g, ' ')
      .replace(/(기록|입력|저장)\S*/g, ' ').replace(/^\s*김비서(야|님)?\s*[,.]?/, ' ')
      .replace(/(오늘|어제|그제|\d+\s*월\s*\d+\s*일)/g, ' ')
      .replace(/\s+/g, ' ').trim();
    if(amount > 0 && nm) return {kind:'gift', nm, a: amount, ev, dir: /(받았|들어왔)/.test(raw) ? 'in' : 'out', date: date ? ymd(date) : todayYmd(), notes};
  }
  if(!title) title = raw.trim();
  // 기념일: "엄마 생일 음력 3월 5일", "결혼기념일 2020년 5월 23일", "사귄 날 2024-03-01"
  if(ddWord && raw3 && raw3.m >= 1 && raw3.m <= 12 && raw3.d >= 1 && raw3.d <= (isLunar ? 30 : 31)){
    const since = /사귄|태어난/.test(ddWord) && !isLunar && raw3.hasYear;
    return {kind:'dday', title, ddKind: since ? 'since' : 'yearly', lunar: !since && isLunar, noYear: !raw3.hasYear,
            date: raw3.y + '-' + pad(raw3.m) + '-' + pad(raw3.d), notes};
  }
  // 음력 일정: "음력 9월 15일 제사" → 그해 양력 날짜로
  if(isLunar && raw3 && date){
    let sd = lunarToSolar(raw3.y, raw3.m, raw3.d);
    if(sd && !raw3.hasYear && dayDiff(sd, today) > 60) sd = lunarToSolar(raw3.y + 1, raw3.m, raw3.d);
    if(sd){ date = sd; notes.push('음력 ' + raw3.m + '월 ' + raw3.d + '일 → 양력 ' + (sd.getMonth()+1) + '월 ' + sd.getDate() + '일'); }
  }
  if(date && intent !== 'memo'){
    if(repeatMonthly) notes.push('매월 반복');
    return {kind:'event', date: ymd(date), time, title, notes, repeat: repeatMonthly ? 'monthly' : null};
  }
  return {kind:'memo', text: title, date: date ? ymd(date) : null, notes};
}

function panelHead(title, sub, right){
  return '<div class="phead"><div><h2>' + title + '</h2><span class="psub">' + sub + '</span></div>' + (right || '') + '</div>';
}
function fmtDateLong(s){ const d = parseYmd(s); return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + DOW[d.getDay()] + '요일'; }

// ---------- 달력 ----------
// 매월 반복 일정: 시작일 이후 매달 같은 날(그달에 그날이 없으면 말일)
function monthlyHits(x, s){
  if(x.repeat !== 'monthly' || !x.date || s < x.date) return false;
  const b = ymdParts(x.date), d = ymdParts(s);
  const last = new Date(d.y, d.m, 0).getDate();
  return d.d === Math.min(b.d, last);
}
function itemsOnDate(s){
  const ev = events().filter(x => x.date === s || monthlyHits(x, s)).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
  const mm = memos().filter(x => x.date === s);
  return {ev, mm};
}
function ddaysOnDate(s){ // 그날이 기념일인 D-day
  const d = parseYmd(s); const out = [];
  ddays().forEach(x => {
    const b = parseYmd(x.date);
    if(x.kind === 'until' && x.date === s) out.push({x, label: x.title});
    if(x.kind === 'yearly'){
      const nx = yearlyNext(x, d); // 그날 이후 첫 기념일이 그날이면
      if(nx && ymd(nx) === s && (x.noYear || nx >= b)) out.push({x, label: x.title});
    }
    if(x.kind === 'since'){
      const n = dayDiff(b, d) + 1;
      if(n > 1 && n % 100 === 0) out.push({x, label: x.title + ' ' + n + '일'});
      if(d > b && b.getMonth() === d.getMonth() && b.getDate() === d.getDate()) out.push({x, label: x.title + ' ' + (d.getFullYear() - b.getFullYear()) + '주년'});
    }
  });
  return out;
}

  // 다가오는 기념일 (30일 안)
  const soon = ddays().map(x => ({x, i: ddayInfo(x)})).filter(o => o.i.soon != null && o.i.soon >= 0 && o.i.soon <= 30).sort((a, b) => a.i.soon - b.i.soon).slice(0, 5);

// ---------- 찾기 (1단계: 글자 일치, 2단계에서 Claude로 '비슷한 뜻' 찾기) ----------
function normalizeKo(s){ return String(s || '').toLowerCase().replace(/\s+/g, ''); }
function itemText(x){
  if(x.type === 'memo') return x.text || '';
  if(x.type === 'gift') return [x.nm, x.ev, x.rel, x.grp, x.memo].filter(Boolean).join(' ');
  if(x.type === 'ref') return [x.title, x.cat, x.keys, x.body].filter(Boolean).join(' ');
  if(x.type === 'link') return [x.title, x.url].filter(Boolean).join(' ');
  return (x.title || '') + ' ' + (x.note || '');
}
function searchItems(q){
  const words = q.split(/\s+/).map(w => w.replace(/(이랑|하고|에서|으로|에게|한테|은|는|이|가|을|를|에|도|랑|의|로)$/,'')).filter(w => w.length >= 1);
  if(!words.length) return [];
  const res = [];
  live().forEach(x => {
    const text = itemText(x);
    const n = normalizeKo(text);
    let score = 0;
    words.forEach(w => { const nw = normalizeKo(w); if(!nw) return; if(n.includes(nw)) score += 2; else if(nw.length >= 2 && [...nw].filter(c => n.includes(c)).length >= Math.ceil(nw.length * 0.7)) score += 1; });
    if(score) res.push({x, score});
  });
  return res.sort((a, b) => b.score - a.score || (b.x.updated || 0) - (a.x.updated || 0));
}
function hl(text, q){
  let h = esc(text);
  q.split(/\s+/).filter(w => w.length >= 1).forEach(w => {
    const ww = esc(w.replace(/(이랑|하고|에서|으로|은|는|이|가|을|를|에|도|랑|의|로)$/,''));
    if(ww) h = h.split(ww).join('<mark>' + ww + '</mark>');
  });
  return h;
}
function renderFind(){
  let h = '<div class="panel">' + panelHead('찾기', '일정·메모·D-day를 한 번에 찾아요.')
    + '<div class="row" style="flex-wrap:nowrap;margin-bottom:14px"><div class="search" style="flex:1;margin:0">' + IC.search
    + '<input id="findInput" placeholder="기억나는 말 (예: 지게차 얘기, 명함)" value="' + esc(findQ) + '" oninput="findQ=this.value;renderFindResults()" onkeydown="if(event.key===\'Enter\')runAiSearch(false)"></div>'
    + (SESSION ? '<button class="btn pri" onclick="runAiSearch(false)">찾기</button>' : '')
    + '</div><div id="findRes"></div></div>';
  document.getElementById('tab-find').innerHTML = h;
  renderFindResults();
}
let aiFind = {q:'', busy:false, answer:'', ids:[], failed:false};
function findCard(x, q){
  if(x.type === 'event') return '<div class="mcard" onclick="editEvent(\'' + x.id + '\')"><div style="flex:1;min-width:0"><div><span class="tag ev">일정</span><span class="muted">' + fmtDate(x.date) + (x.time ? ' ' + fmtTime(x.time) : '') + '</span></div><div class="mtext" style="font-weight:700;margin-top:4px">' + hl(x.title, q) + '</div>' + (x.note ? '<div class="mtext muted">' + hl(x.note, q) + '</div>' : '') + '</div></div>';
  if(x.type === 'memo') return '<div class="mcard" onclick="editMemo(\'' + x.id + '\')"><div style="flex:1;min-width:0"><div><span class="tag memo">메모</span><span class="muted">' + (x.date ? fmtDate(x.date) + ' · ' : '') + new Date(x.created).toLocaleDateString('ko-KR') + '</span></div><div class="mtext" style="margin-top:4px">' + hl(x.text, q) + '</div></div></div>';
  if(x.type === 'gift') return '<div class="mcard" onclick="editGift(\'' + x.id + '\')"><div style="flex:1;min-width:0"><div><span class="tag dd">경조사</span><span class="muted">' + esc(x.ev || '') + (x.d ? ' · ' + fmtDate(x.d, true) : '') + '</span></div><div class="mtext" style="font-weight:700;margin-top:4px">' + hl(x.nm, q) + ' · <span class="' + (x.dir === 'in' ? 'gin' : 'gout') + '">' + won(x.a) + (x.dir === 'in' ? ' 받음' : ' 냄') + '</span></div>' + (x.memo ? '<div class="mtext muted">' + hl(x.memo, q) + '</div>' : '') + '</div></div>';
  if(x.type === 'ref') return '<div class="mcard" onclick="openRef(\'' + x.id + '\')"><div style="flex:1;min-width:0"><div><span class="tag ev">회사 규정</span><span class="muted">' + esc(x.cat || '') + '</span></div><div class="mtext" style="font-weight:700;margin-top:4px">' + hl(x.title, q) + '</div><div class="mtext muted">' + esc(String(x.body || '').split('\n')[0]) + '</div></div></div>';
  if(x.type === 'link') return '<a class="mcard" href="' + esc(x.url) + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><div style="flex:1;min-width:0"><div><span class="tag memo">바로가기</span></div><div class="mtext" style="font-weight:700;margin-top:4px">' + hl(x.title, q) + '</div></div></a>';
  return '<div class="mcard" onclick="editDday(\'' + x.id + '\')"><div style="flex:1;min-width:0"><div><span class="tag dd">D-day</span><span class="muted">' + esc(ddDateLabel(x)) + '</span></div><div class="mtext" style="font-weight:700;margin-top:4px">' + hl(x.title, q) + '</div></div></div>';
}
function renderFindResults(){
  const box = document.getElementById('findRes'); if(!box) return;
  const q = findQ.trim();
  if(!q){ box.innerHTML = '<div class="empty">입력칸에 "지게차 얘기 언제였지?"라고 해도 돼요.' + (SESSION ? '' : '<br><span class="muted">로그인하면 비슷한 뜻으로도 찾아요.</span>') + '</div>'; return; }
  let h = '';
  const shown = new Set();
  if(aiFind.q === q){
    if(aiFind.busy) h += '<div class="aibox">비슷한 뜻으로 찾는 중…</div>';
    else if(aiFind.failed) h += '<div class="aibox" style="background:var(--cell);color:var(--sub)">비슷한 뜻 찾기에 실패했어요 — 글자가 같은 기록만 보여 드려요.</div>';
    else {
      h += '<div class="aibox">' + esc(aiFind.answer) + '</div>';
      aiFind.ids.forEach(id => { const x = live().find(i => i.id === id); if(x){ shown.add(id); h += findCard(x, q); } });
    }
  }
  const r = searchItems(q).filter(o => !shown.has(o.x.id));
  if(r.length){
    if(shown.size || aiFind.q === q) h += '<div class="find-sec">글자가 같은 기록 ' + r.length + '건</div>';
    else h += '<div class="muted" style="margin-bottom:8px">' + r.length + '건' + (SESSION ? ' · Enter를 누르면 비슷한 뜻까지 찾아요' : '') + '</div>';
    r.forEach(({x}) => h += findCard(x, q));
  }
  if(!h) h = '<div class="empty">"' + esc(q) + '" — 찾지 못했어요.' + (SESSION ? '<br><span class="muted">Enter를 누르면 비슷한 뜻까지 찾아요.</span>' : '<br><span class="muted">로그인하면 비슷한 뜻으로도 찾아요.</span>') + '</div>';
  box.innerHTML = h;
}
async function runAiSearch(fromVoice){
  const q = findQ.trim(); if(!q) return;
  if(!SESSION){
    if(fromVoice){ const n = searchItems(q).length; speak(n ? q + ', ' + n + '건 찾았어요.' : q + ', 찾지 못했어요.'); }
    return;
  }
  aiFind = {q, busy:true, answer:'', ids:[], failed:false}; renderFindResults();
  const typeName = {event:'일정', memo:'메모', dday:'D-day', gift:'경조사', ref:'회사규정', link:'바로가기'};
  const items = live().slice().sort((a, b) => (b.updated || 0) - (a.updated || 0)).slice(0, 600)
    .map(x => x.id + '|' + typeName[x.type] + '|' + (x.date || '') + (x.time ? ' ' + x.time : '') + '|' + String(x.type === 'gift' ? x.nm + ' ' + x.ev + ' ' + won(x.a) + (x.dir === 'in' ? ' 받음' : ' 냄') : itemText(x)).replace(/\s+/g, ' ').slice(0, 150));
  const res = await aiCall({action:'search', query:q, items}, 15000);
  if(findQ.trim() !== q) return;
  aiFind = res ? {q, busy:false, answer: String(res.answer || ''), ids: Array.isArray(res.ids) ? res.ids : [], failed:false} : {q, busy:false, answer:'', ids:[], failed:true};
  if(TAB === 'find') renderFindResults();
  if(fromVoice){
    if(res) speak(aiFind.answer);
    else { const n = searchItems(q).length; speak(n ? q + ', ' + n + '건 찾았어요.' : q + ', 찾지 못했어요.'); }
  }
}

function renderDrawerBody(){

// 사람별로 묶기(이름 같으면 한 사람)
function giftPeople(){
  const map = new Map();
  gifts().forEach(x => {
    const k = String(x.nm || '').replace(/\s+/g, '');
    if(!map.has(k)) map.set(k, {nm: x.nm, list: [], inSum: 0, outSum: 0, last: '', rel: '', grp: ''});
    const p = map.get(k);
    p.list.push(x);
    if(x.dir === 'in') p.inSum += Number(x.a || 0); else p.outSum += Number(x.a || 0);
    if(x.d && x.d > p.last) p.last = x.d;
    p.rel = p.rel || x.rel || ''; p.grp = p.grp || x.grp || '';
  });
  return [...map.values()];
}
let giftOpen = '';
function giftListHtml(){
  const all = giftPeople();
  const q = normalizeKo(giftQ);
  let rows = q ? all.filter(p => normalizeKo(p.nm + p.rel + p.grp + p.list.map(x => x.memo || '').join('')).includes(q)) : all;
  if(giftSort === 'in') rows.sort((a, b) => b.inSum - a.inSum);
  else if(giftSort === 'out') rows.sort((a, b) => b.outSum - a.outSum);
  else if(giftSort === 'recent') rows.sort((a, b) => (b.last || '').localeCompare(a.last || ''));
  else rows.sort((a, b) => a.nm.localeCompare(b.nm, 'ko'));
  const tin = gifts().filter(x => x.dir === 'in').reduce((t, x) => t + Number(x.a || 0), 0);
  const tout = gifts().filter(x => x.dir === 'out').reduce((t, x) => t + Number(x.a || 0), 0);
  let h = '<div class="gtot"><div><dt>받은 돈</dt><dd class="gin">' + won(tin) + '</dd></div><div><dt>낸 돈</dt><dd class="gout">' + won(tout) + '</dd></div><div><dt>사람</dt><dd>' + all.length + '명</dd></div></div>';
  if(!all.length) return h + '<div class="empty">경조사 기록이 없어요.<br>"홍길동 장례식 10만원 냈어"처럼 말해도 돼요.</div>';
  if(!rows.length) return h + '<div class="empty">"' + esc(giftQ) + '" — 없어요.</div>';
  const shown = rows.slice(0, 200);
  shown.forEach(p => {
    const key = String(p.nm).replace(/\s+/g, '');
    h += '<div class="gperson"><div class="gh" onclick="giftOpen=giftOpen===\'' + esc(key) + '\'?\'\':\'' + esc(key) + '\';renderDrawerBody()"><b>' + esc(p.nm) + (p.rel || p.grp ? ' <span class="tag memo" style="vertical-align:1px">' + esc(p.rel || p.grp) + '</span>' : '') + '</b>'
      + (p.inSum ? '<span class="gin">받음 ' + won(p.inSum) + '</span>' : '') + (p.outSum ? '<span class="gout">냄 ' + won(p.outSum) + '</span>' : '') + '</div>';
    if(giftOpen === key){
      h += '<div class="gbody">';
      p.list.sort((a, b) => (b.d || '').localeCompare(a.d || '')).forEach(x => {
        h += '<div class="gline" onclick="editGift(\'' + x.id + '\')"><span class="' + (x.dir === 'in' ? 'gin' : 'gout') + '" style="font-weight:700;white-space:nowrap">' + (x.dir === 'in' ? '받음 ' : '냄 ') + won(x.a) + '</span><span class="m">' + esc([x.ev, x.d ? fmtDate(x.d, true) : '', x.memo].filter(Boolean).join(' · ')) + '</span></div>';
      });
      h += '<div class="row" style="margin-top:8px"><button class="btn sec sm" onclick="editGift(null,{nm:\'' + esc(p.nm).replace(/'/g, "\\'") + '\',dir:\'out\'})">+ 이 사람 기록</button></div></div>';
    }
    h += '</div>';
  });
  if(rows.length > shown.length) h += '<div class="muted" style="text-align:center;padding:8px">' + (rows.length - shown.length) + '명 더 — 검색으로 찾아 주세요</div>';
  return h;
}
function giftFind(q){
  const k = normalizeKo(q).replace(/얼마.*$/, '').replace(/(한테|에게|님|씨)$/, '');
  if(k.length < 2) return null;
  return giftPeople().find(p => normalizeKo(p.nm) === k) || giftPeople().filter(p => normalizeKo(p.nm).includes(k)).sort((a, b) => a.nm.length - b.nm.length)[0] || null;
}
function giftSummary(q){
  const p = giftFind(q);
  if(!p) return '';
  const say = a => a % 10000 === 0 ? (a / 10000) + '만 원' : a.toLocaleString('ko-KR') + '원';
  const lastOf = dir => p.list.filter(x => x.dir === dir).sort((a, b) => String(b.d || '').localeCompare(String(a.d || '')))[0];
  const one = (dir, sum, word) => {
    if(!sum) return word + ' 돈 없음';
    const n = p.list.filter(x => x.dir === dir).length, l = lastOf(dir);
    const when = l && l.d ? ymdParts(l.d).y + '년 ' : '';
    return word + ' 돈 ' + say(sum) + (n > 1 ? ' (' + n + '번, 최근 ' + when + (l.ev || '') + ' ' + say(Number(l.a || 0)) + ')' : (l && (when || l.ev) ? ' (' + when + (l.ev || '') + ')' : ''));
  };
  return p.nm + ', ' + one('out', p.outSum, '낸') + ', ' + one('in', p.inSum, '받은') + '.';
}

function importData(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.items)) throw 0;
      const have = new Set(DB.items.map(x => x.id)); let add = 0;
      d.items.forEach(x => { if(x && x.id && !have.has(x.id)){ DB.items.push(x); markDirty(x.id); add++; } });
      saveDB(); render(); syncSoon(); closeModal(); toast('불러왔어요 — 새 항목 ' + add + '개 (기존 항목은 유지)');
    }catch(e){ toast('김비서 백업 파일이 아니에요'); }
  };
  r.readAsText(file);
}

function fromAi(a, raw){
  if(!a || typeof a !== 'object') return null;
  const okDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '') && !isNaN(parseYmd(v).getTime());
  const okTime = v => /^([01]\d|2[0-3]):[0-5]\d$/.test(v || '');
  const notes = a.note ? [String(a.note).slice(0, 80)] : [];
  const str = v => (typeof v === 'string' ? v.trim() : '');
  if(a.kind === 'find' && str(a.query)) return {kind:'find', query: str(a.query)};
  if(a.kind === 'event' && okDate(a.date) && str(a.title)) return {kind:'event', date:a.date, time: okTime(a.time) ? a.time : null, title: str(a.title), notes};
  if(a.kind === 'dday' && okDate(a.date) && str(a.title)){
    const k = ['since','until','yearly'].includes(a.dday_kind) ? a.dday_kind : 'since';
    return {kind:'dday', date:a.date, title: str(a.title), ddKind: k, lunar: k === 'yearly' && a.lunar === true, noYear: k === 'yearly' && a.no_year === true, notes};
  }
  if(a.kind === 'memo') return {kind:'memo', text: str(a.text) || raw, date: okDate(a.date) ? a.date : null, notes};
  return null;
}

function dayAnswerText(s, withDate){
  const d = parseYmd(s), {ev, mm} = itemsOnDate(s), dd = ddaysOnDate(s);
  const head = withDate ? (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + DOW[d.getDay()] + '요일' : '';
  if(!ev.length && !mm.length && !dd.length) return withDate ? head + '은 비어 있어요.' : '';
  const parts = [];
  dd.forEach(o => parts.push(o.label));
  ev.forEach(x => parts.push((x.time ? fmtTime(x.time) + ' ' : '') + x.title));
  mm.forEach(x => parts.push('메모 ' + x.text.split('\n')[0]));

let REC = null, recOn = false;
function speak(text){

// 말하는 동안은 계속 듣고, 말이 2.2초 끊기면 끝. 처음엔 9초까지 기다림(빅스비로 연 직후 대비), 최대 30초.
// 폰 Chrome이 중간에 듣기를 끊어도(말 사이 숨 고르기) 이어서 다시 들음.
// ⚠️ continuous 모드는 안드로이드 Chrome이 중간 결과("내일"→"내일 11시"→…)를 각각 완성 문장으로 보내 말이 여러 번 붙음 → 한 마디씩 듣고 다시 켜는 방식.
const REC_SILENCE_MS = 2200, REC_FIRST_WAIT_MS = 9000, REC_MAX_MS = 30000;
let recWanted = false, recText = '', recSession = '', recStartAt = 0, recLastAt = 0, recSilenceT = null, recMaxT = null;
function toggleMic(){
  if(voiceMode() === 'wispr' && !recOn && !recWanted){ focusAskForWispr(); return; }
  if(recOn || recWanted){ endListening(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('이 브라우저는 음성 입력을 지원하지 않아요 — 키보드 마이크(Wispr Flow)를 써 주세요'); document.getElementById('askInput').focus(); return; }
  recWanted = true; recOn = true; recText = ''; recSession = ''; recStartAt = Date.now(); recLastAt = 0;
  const inp = document.getElementById('askInput');
  inp.value = ''; inp.placeholder = '듣고 있어요… 말씀하세요';
  document.getElementById('micBtn').classList.add('on');
  clearTimeout(recMaxT); recMaxT = setTimeout(endListening, REC_MAX_MS);
  spawnRec();
}
function spawnRec(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const inp = document.getElementById('askInput');
  REC = new SR();
  REC.lang = 'ko-KR'; REC.interimResults = true; REC.continuous = false;
  REC.onstart = () => { document.getElementById('voiceGate').classList.add('hidden'); };
  REC.onresult = e => {
    // 이번 마디는 마지막 결과 하나만 씀(앞 결과를 이어 붙이지 않음 — 같은 말이 겹치는 것 방지)
    const r = e.results[e.results.length - 1];
    const cur = String(r[0].transcript || '').trim();
    if(r.isFinal) recSession = cur;
    inp.value = joinSpeech(recText, cur);
    recLastAt = Date.now();
    clearTimeout(recSilenceT);
    recSilenceT = setTimeout(() => { if(recWanted){ recWanted = false; try{ REC.stop(); }catch(_){ finishListening(); } } }, REC_SILENCE_MS);
  };
  REC.onerror = e => {
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){ recWanted = false; toast('마이크 권한을 허용해 주세요'); }
    else if(e.error === 'network'){ recWanted = false; toast('음성 인식은 인터넷이 필요해요'); }
  };
  REC.onend = () => {
    recText = joinSpeech(recText, recSession); recSession = '';
    if(recWanted){
      const now = Date.now();
      const waiting = !recText && now - recStartAt < REC_FIRST_WAIT_MS;           // 아직 말을 시작 안 함
      const midSpeech = recText && recLastAt && now - recLastAt < REC_SILENCE_MS;  // 말하다 잠깐 끊김
      if((waiting || midSpeech) && now - recStartAt < REC_MAX_MS){ try{ spawnRec(); return; }catch(_){} }
    }
    finishListening();
  };
  try{ REC.start(); }catch(e){ recWanted = false; finishListening(); toast('마이크를 시작하지 못했어요'); }
}
// 앞 마디와 이어 붙이기 — 새 마디가 앞 말을 다시 포함해 오면(폰에서 가끔) 겹치지 않게
function joinSpeech(prev, next){
  prev = String(prev || '').replace(/\s+/g, ' ').trim(); next = String(next || '').replace(/\s+/g, ' ').trim();
  if(!next) return prev;
  if(!prev) return next;
  if(next.startsWith(prev)) return next;
  if(prev.endsWith(next) || prev.includes(next)) return prev;
  return prev + ' ' + next;
}
function endListening(){
  recWanted = false; clearTimeout(recSilenceT);
  try{ REC.stop(); }catch(e){ finishListening(); }
}
function finishListening(){
  if(!recOn) return;
  recOn = false; recWanted = false; clearTimeout(recSilenceT); clearTimeout(recMaxT);
  document.getElementById('micBtn').classList.remove('on');
  const inp = document.getElementById('askInput');
  applyVoiceMode();
  if(recText) inp.value = recText;
  if(inp.value.trim()) onAsk(true);
  else if(Date.now() - recStartAt > 1500) toast('말씀이 안 들렸어요');
}

    const rows = Object.keys(snap).map(id => { const x = DB.items.find(i => i.id === id); return {id, type: x.type, data: x, updated: x.updated || 0, deleted: !!x.deleted}; });
    for(let i = 0; i < rows.length; i += 200){
      const {data, error} = await SB.from('kbs_items').upsert(rows.slice(i, i + 200), {onConflict: 'id'}).select('id,type,data,updated,deleted,server_at');
      if(error) throw error;
      (data || []).forEach(mergeRemote); // 서버에 더 최신이 있으면 그걸로
    }
    // 올리는 사이 다시 고친 것은 남겨 둠
    DB.dirty = DB.dirty.filter(id => { const x = DB.items.find(i => i.id === id); return !(id in snap) || (x && (x.updated || 0) > snap[id]); });
    // 2) 다른 기기에서 고친 것 받기 (서버 시각 기준, 5초 겹쳐 읽기)
    for(let page = 0; page < 20; page++){
      let q = SB.from('kbs_items').select('id,type,data,updated,deleted,server_at').order('server_at', {ascending: true}).limit(1000);
      if(DB.lastPull) q = q.gt('server_at', new Date(new Date(DB.lastPull).getTime() - 5000).toISOString());
      const {data, error} = await q;
      if(error) throw error;
      (data || []).forEach(mergeRemote);
      if(!data || !data.length) break;
      const last = data[data.length - 1].server_at;
      if(DB.lastPull && new Date(last) <= new Date(DB.lastPull)) break;
      DB.lastPull = last;
      if(data.length < 1000) break;
    }
    saveDB(); lastSyncAt = Date.now(); syncErr = '';
    render();
  }catch(e){
    syncErr = (e && e.message) ? '동기화 실패: ' + e.message : '동기화 실패';
  }finally{
    syncing = false; updateSyncBadge();
  }
}
function updateSyncBadge(){
  const el = document.getElementById('syncState'); if(!el) return;
  let cls = '', txt = '이 기기';
  if(SESSION){
    if(syncing){ cls = 'busy'; txt = '맞추는 중'; }
    else if(syncErr){ cls = 'err'; txt = navigator.onLine ? '동기화 오류' : '오프라인'; }
    else { cls = 'ok'; txt = DB.dirty.length ? '대기 ' + DB.dirty.length : '동기화됨'; }
  }
  el.className = 'sync ' + cls;
  el.querySelector('span').textContent = txt;
}
function accountHtml(){
  let h = '<div class="sec"><h3>계정 · 동기화</h3>';
  if(!SB){
    h += '<div class="muted">' + esc(syncErr || '서버에 연결하는 중…') + '</div></div>';
    return h;
  }
  if(!SESSION){
    return h + '<div class="muted" style="margin-bottom:10px">로그인하면 PC·폰이 자동으로 맞춰지고, Claude가 말을 알아듣고 비슷한 뜻으로도 찾아줘요.</div>'
      + '<div class="field"><input id="f_email" type="email" autocomplete="username" placeholder="이메일"></div>'
      + '<div class="field"><input id="f_pw" type="password" autocomplete="current-password" placeholder="비밀번호" onkeydown="if(event.key===\'Enter\')sbLogin()"></div>'
      + '<button class="btn pri" style="width:100%" onclick="sbLogin()">로그인</button></div>';
  }
  const t = lastSyncAt ? new Date(lastSyncAt).toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'}) : '—';
  return h + '<div style="font-weight:700">' + esc(SESSION.user.email || '') + '</div>'
    + '<div class="muted" style="margin:4px 0 10px">마지막 동기화 ' + t + (DB.dirty.length ? ' · 올릴 것 ' + DB.dirty.length + '개' : '') + '</div>'
    + (syncErr ? '<div class="muted" style="color:var(--sun);margin-bottom:10px">' + esc(syncErr) + '</div>' : '')
    + '<div class="row"><button class="btn sec sm" onclick="syncNow().then(openSettings)">지금 동기화</button><button class="btn sec sm" onclick="sbLogout()">로그아웃</button></div></div>';
}
async function sbLogin(){
  if(!SB) return;
  const email = val('f_email'), password = document.getElementById('f_pw').value;
  if(!email || !password){ toast('이메일과 비밀번호를 넣어 주세요'); return; }
  const {error} = await SB.auth.signInWithPassword({email, password});
  if(error){ toast(/invalid/i.test(error.message) ? '이메일 또는 비밀번호가 맞지 않아요' : '로그인 실패: ' + error.message); return; }
  toast('로그인했어요 — 기록을 맞추는 중'); openSettings();
}
async function sbLogout(){
  if(!SB || !confirm('로그아웃할까요? 이 기기 기록은 그대로 남아요.')) return;
  await SB.auth.signOut(); toast('로그아웃했어요'); openSettings();
}
// Claude 호출 (Edge Function kbs-ai). 실패·시간 초과면 null
async function aiCall(body, ms){
  if(!SB || !SESSION || !navigator.onLine) return null;
  try{
    const r = await Promise.race([
      SB.functions.invoke('kbs-ai', {body}),
      new Promise(res => setTimeout(() => res({timeout: true}), ms || 8000))
    ]);
    if(!r || r.timeout || r.error || !r.data || !r.data.result) return null;
    return r.data.result;
  }catch(e){ return null; }
}

// ---------- 아침 알림 (웹푸시 — 서버 함수 kbs-brief가 매일 정한 시각에 보냄) ----------
const VAPID_PUBLIC = 'BIeY1uKfBsHKaDHpNk-OJNMvGHVtNoeZTnVPTOjJ06fZNuX8qkH14tRtcniM_iIX8BjRonuvmP9UPTMRBhcyDqc';
const PUSH_HOURS = [5, 6, 7, 8, 9, 10, 11, 12, 18, 20, 21, 22];
function hourLabel(h){ return (h < 12 ? '오전 ' + h : (h === 12 ? '낮 12' : '오후 ' + (h - 12))) + '시'; }
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function pushHourPref(){ let h = 7; try{ h = +(localStorage.getItem('kbs_push_hour') || 7); }catch(e){} return PUSH_HOURS.includes(h) ? h : 7; }
function b64uToU8(b64){ const p = '='.repeat((4 - b64.length % 4) % 4); const raw = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
async function pushSub(){
  if(!pushSupported()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}
async function renderPushBox(){
  const box = document.getElementById('pushBox'); if(!box) return;
  const head = '<h3>아침 알림</h3>';
  if(!pushSupported()){ box.innerHTML = head + '<div class="muted">이 브라우저는 알림을 지원하지 않아요. 폰은 Chrome에서 홈 화면에 설치한 김비서로 열어 주세요.</div>'; return; }
  if(!SESSION){ box.innerHTML = head + '<div class="muted">로그인하면 매일 아침 오늘 일정과 다가오는 생일·기념일을 알려 드려요.</div>'; return; }
  let sub = null, row = null;
  try{
    sub = await pushSub();
    if(sub){ const r = await SB.from('kbs_push').select('hour').eq('endpoint', sub.endpoint).maybeSingle(); row = r.data || null; }
  }catch(e){}
  if(!document.getElementById('pushBox')) return;
  const on = !!(sub && row);
  const hour = row ? row.hour : pushHourPref();
  box.innerHTML = head + '<div class="muted" style="margin-bottom:10px">매일 정한 시각에 오늘·내일 일정, 1주 안의 생일·기념일을 이 기기로 알려 드려요.</div>'
    + '<div class="row"><select id="f_pushHour" style="width:auto" onchange="pushSetHour(+this.value)">'
    + PUSH_HOURS.map(h => '<option value="' + h + '"' + (h === hour ? ' selected' : '') + '>' + hourLabel(h) + '</option>').join('') + '</select>'
    + (on ? '<button class="btn sec sm" onclick="pushTest()">테스트 알림</button><button class="btn sec sm" onclick="pushDisable()">끄기</button>'
          : '<button class="btn pri sm" onclick="pushEnable()">알림 켜기</button>') + '</div>'
    + (Notification.permission === 'denied' ? '<div class="muted" style="color:var(--sun);margin-top:8px">알림이 차단돼 있어요 — 폰 설정 → 애플리케이션 → Chrome → 알림 허용 후 다시 눌러 주세요.</div>' : '')
    + (on ? '<div class="muted" style="margin-top:8px">켜짐 · 이 기기로 매일 ' + hourLabel(hour) + '</div>' : '');
}
async function pushEnable(){
  if(!SB || !SESSION) return;
  const hour = +(val('f_pushHour') || pushHourPref());
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ toast('알림 권한이 필요해요'); renderPushBox(); return; }
    const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((_, no) => setTimeout(() => no(new Error('sw')), 6000))]);
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64uToU8(VAPID_PUBLIC)}));
    const j = sub.toJSON();
    const {error} = await SB.from('kbs_push').upsert({endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, hour, ua: navigator.userAgent.slice(0, 120)}, {onConflict: 'endpoint'});
    if(error) throw error;
    try{ localStorage.setItem('kbs_push_hour', hour); }catch(e){}
    toast('아침 알림을 켰어요');
  }catch(e){
    toast(/kbs_push/.test(String(e && e.message)) ? '서버 준비(02 SQL)가 아직이에요' : '알림을 켜지 못했어요: ' + (e && e.message || e));
  }
  renderPushBox();
}
async function pushSetHour(h){
  try{ localStorage.setItem('kbs_push_hour', h); }catch(e){}
  const sub = await pushSub();
  if(sub && SB && SESSION){
    const {error} = await SB.from('kbs_push').update({hour: h, last_sent: null}).eq('endpoint', sub.endpoint);
    toast(error ? '시각을 바꾸지 못했어요' : '알림 시각을 바꿨어요');
  }
  renderPushBox();
}
async function pushDisable(){
  const sub = await pushSub();
  if(sub){
    if(SB && SESSION) await SB.from('kbs_push').delete().eq('endpoint', sub.endpoint);
    try{ await sub.unsubscribe(); }catch(e){}
  }
  toast('아침 알림을 껐어요'); renderPushBox();
}
async function pushTest(){
  if(!SB || !SESSION) return;
  toast('보내는 중…');
  try{
    const {data, error} = await SB.functions.invoke('kbs-brief', {body: {action: 'test'}});
    if(error) throw error;
    toast(data && data.sent ? '테스트 알림을 보냈어요 — 몇 초 안에 와요' : '보낼 기기가 없어요 — 알림을 다시 켜 주세요');
  }catch(e){
    // 원인을 바로 알 수 있게: 404 = 함수 없음(배포 전), 401 = Verify JWT 켜짐 등, 500 = 비밀값·표 문제
    const st = e && e.context && e.context.status;
    let msg = '';
    try{ const j = await e.context.json(); msg = j.message || j.error || j.msg || ''; }catch(_){}
    toast(st === 404 ? '서버 함수 kbs-brief가 아직 없어요 — 배포가 필요해요'
        : st === 401 ? '함수 설정에서 Verify JWT를 꺼 주세요 (401)'
        : '알림 서버 오류' + (st ? ' ' + st : '') + (msg ? ': ' + String(msg).slice(0, 90) : ' — 네트워크 확인'));
  }
}

// ---------- 공통 ----------
let toastT = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), msg.length > 30 ? 5000 : 2600);
}
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeModal(); } });
let rsT = null, rsW = window.innerWidth; window.addEventListener('resize', () => { if(window.innerWidth === rsW) return; rsW = window.innerWidth; clearTimeout(rsT); rsT = setTimeout(render, 150); }); // 키패드로 높이만 바뀌면 안 그림
document.addEventListener('visibilitychange', () => { if(!document.hidden){ render(); syncNow(); } }); // 날짜 넘어가면 갱신 + 다른 기기 변경 받기
window.addEventListener('online', () => { syncErr = ''; syncNow(); });
setInterval(() => { if(!document.hidden) syncNow(); }, 60000);

// ---------- 시작 ----------
applyTheme();
render();
applyVoiceMode();
sbLoad();
// 빅스비 빠른 명령어 등으로 ?voice=1 주소를 열면 바로 듣기 시도 (브라우저가 막으면 마이크 버튼 안내)
// 브라우저가 터치 없이 마이크를 못 켜게 하면 큰 마이크 버튼이 남아 있음(한 번 누르면 시작)
function voiceGateTap(){ document.getElementById('voiceGate').classList.add('hidden'); if(voiceMode() === 'wispr') focusAskForWispr(); else if(!recOn) toggleMic(); }
// 설정 '앱을 열면 바로 듣기' — 빅스비가 앱을 어떤 방식으로 열든(주소·앱 열기·뒤에 있던 앱 불러오기) 바로 말할 수 있게
function autoVoiceOn(){ try{ return localStorage.getItem('kbs_auto_voice') === '1'; }catch(e){ return false; } }
function setAutoVoice(on){ try{ localStorage.setItem('kbs_auto_voice', on ? '1' : '0'); }catch(e){} toast(on ? '앱을 열면 바로 들을게요' : '바로 듣기를 껐어요'); }
function startVoiceGate(){
  if(recOn || document.getElementById('modal').classList.contains('show')) return;
  // Wispr 모드: 큰 마이크 화면 없이 바로 입력칸 선택 — 입력칸이 잡히면 Wispr 떠 있는 버튼이 바로 떠서 한 번에 말할 수 있음(폰에 따라 키보드는 안 뜰 수 있음)
  if(voiceMode() === 'wispr'){ setTimeout(focusAskForWispr, 300); return; }
  document.getElementById('voiceGate').classList.remove('hidden');
  setTimeout(() => { try{ if(!recOn) toggleMic(); }catch(e){} }, 400);
}
if(/[?&]voice=1/.test(location.search) || autoVoiceOn()){
  startVoiceGate();
  if(/[?&]voice=1/.test(location.search)){ try{ history.replaceState(null, '', location.pathname); }catch(e){} }
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ hiddenAt = Date.now(); return; }
  if(autoVoiceOn() && hiddenAt && Date.now() - hiddenAt > 15000) startVoiceGate(); // 15초 넘게 다른 앱에 있다 돌아오면
});
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
