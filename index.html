<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김비서</title>
<meta name="description" content="음성으로 관리하는 나만의 일정·메모·D-day 비서">
<meta name="theme-color" content="#0F2419">
<meta name="app-build-version" content="v3-sync-ai">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script>window.APP_BUILD = 'v3-sync-ai';</script>
<style>
:root{
  --deep:#0F2419; --yellow:#FFEB3B; --lgreen:#A5D6A7; --orange:#F57F17;
  --bg:#F2F4F3; --card:#FFFFFF; --cell:#F6F7F7; --text:#191C1B; --sub:#6E7773; --line:#E5E8E7;
  --sun:#E5484D; --sat:#3E7BFA; --accent:#0F2419;
  --ev-bg:#E6F4EA; --ev-tx:#1D5B33; --ev-dot:#34A853;
  --mm-bg:#FFF5D1; --mm-tx:#755800; --mm-dot:#F2B600;
  --dd-bg:#FFE9DA; --dd-tx:#9A4300; --dd-dot:#F57F17;
  --shadow:0 1px 2px rgba(16,24,20,.04),0 4px 16px rgba(16,24,20,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1311; --card:#171D1A; --cell:#1D2421; --text:#E9EEEB; --sub:#97A39D; --line:#2A3330;
    --sun:#FF7B7F; --sat:#7AA5FF; --accent:#A5D6A7;
    --ev-bg:#1E3527; --ev-tx:#A8DDB5; --mm-bg:#3A3215; --mm-tx:#F3D77A; --dd-bg:#3E2814; --dd-tx:#FFC08F;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1311; --card:#171D1A; --cell:#1D2421; --text:#E9EEEB; --sub:#97A39D; --line:#2A3330;
  --sun:#FF7B7F; --sat:#7AA5FF; --accent:#A5D6A7;
  --ev-bg:#1E3527; --ev-tx:#A8DDB5; --mm-bg:#3A3215; --mm-tx:#F3D77A; --dd-bg:#3E2814; --dd-tx:#FFC08F;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:15px;letter-spacing:-.2px;
  -webkit-tap-highlight-color:transparent;padding-bottom:calc(140px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1200px;margin:0 auto;height:60px;padding:0 16px;display:flex;align-items:center;gap:10px}
.top .logo{width:28px;height:28px;flex:none}
.top h1{font-size:18px;margin:0 18px 0 0;font-weight:800}
.top nav{display:none;height:100%;gap:4px}
.top nav button{background:none;border:0;padding:0 14px;height:100%;font-size:15px;color:var(--sub);font-weight:600;border-bottom:2px solid transparent}
.top nav button.on{color:var(--text);border-bottom-color:var(--text)}
.top .today{margin-left:auto;font-size:13px;color:var(--sub);white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);background:none;border:0;padding:4px 6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.sync.ok i{background:var(--ev-dot)} .sync.busy i{background:var(--mm-dot)} .sync.err i{background:var(--sun)}
@media (max-width:640px){ .top .today{display:none} .sync{margin-left:auto} }
.aibox{background:var(--ev-bg);color:var(--ev-tx);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-weight:600;line-height:1.5}
.find-sec{font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 8px}
.icon-btn{background:var(--cell);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--text)}
@media (min-width:900px){ .top nav{display:flex} }

.wrap{max-width:1200px;margin:0 auto;padding:16px}
.panel{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
@media (max-width:640px){ .wrap{padding:12px} .panel{padding:14px;border-radius:16px} }
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.phead h2{display:inline;margin:0 10px 0 0;font-size:20px;font-weight:800}
.psub{color:var(--sub);font-size:13px}
.mnav{display:flex;align-items:center;gap:8px}
.mnav b{font-size:17px;min-width:104px;text-align:center}
.muted{color:var(--sub);font-size:13px}
.empty{color:var(--sub);text-align:center;padding:26px 8px;font-size:14px;line-height:1.6}

/* 필터 칩 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px 6px 8px;font-size:14px;font-weight:600;color:var(--sub)}
.fchip .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:#fff}
.fchip .box .ico{width:14px;height:14px;stroke-width:3}
.fchip.on{color:var(--text)}
.fchip.f-event.on{border-color:var(--ev-dot);background:var(--ev-bg)} .fchip.f-event.on .box{background:var(--ev-dot);border-color:var(--ev-dot)}
.fchip.f-memo.on{border-color:var(--mm-dot);background:var(--mm-bg)} .fchip.f-memo.on .box{background:var(--mm-dot);border-color:var(--mm-dot)}
.fchip.f-dday.on{border-color:var(--dd-dot);background:var(--dd-bg)} .fchip.f-dday.on .box{background:var(--dd-dot);border-color:var(--dd-dot)}
.seg{display:inline-flex;background:var(--cell);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* 달력 */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:980px){ .cal-layout{grid-template-columns:minmax(0,1fr) 300px} }
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:13px;font-weight:700;padding:2px 8px 4px;color:var(--sub)}
.cal .dow.sun{color:var(--sun)} .cal .dow.sat{color:var(--sat)}
.cell{min-height:118px;background:var(--cell);border:1.5px solid transparent;border-radius:12px;padding:8px;overflow:hidden;cursor:pointer;min-width:0}
.cell:hover{border-color:var(--line)}
.cell.other{background:transparent}
.cell.other .dn{opacity:.4}
.cell.sel{border-color:var(--text)}
.cell .dn{font-size:14px;font-weight:700;margin-bottom:4px}
.cell .dn span{display:inline-block;min-width:24px;padding:1px 5px;border-radius:6px;text-align:center}
.cell.today .dn span{background:var(--text);color:var(--card)}
.cell .dn.sun{color:var(--sun)} .cell .dn.sat{color:var(--sat)}
.pill{display:block;font-size:12px;font-weight:600;line-height:1.3;padding:3px 6px;border-radius:5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.ev{background:var(--ev-bg);color:var(--ev-tx)}
.pill.memo{background:var(--mm-bg);color:var(--mm-tx)}
.pill.dd{background:var(--dd-bg);color:var(--dd-tx)}
.cell .more{font-size:11px;color:var(--sub);margin-top:3px;padding-left:2px}
@media (max-width:640px){
  .cal{gap:3px}
  .cal .dow{padding:2px 0;text-align:center;font-size:12px}
  .cell{min-height:70px;padding:4px 3px;border-radius:8px}
  .cell .dn{font-size:12px;text-align:center;margin-bottom:2px}
  .cell .dn span{min-width:20px;padding:0 3px}
  .pill{font-size:10px;padding:1px 3px;border-radius:3px;margin-top:2px;letter-spacing:-.4px}
  .cell .more{font-size:10px;text-align:center;padding:0}
}

/* 오른쪽(폰은 아래) 날짜 패널 */
.side{background:var(--cell);border-radius:16px;padding:16px;align-self:start}
.side h3{margin:0 0 12px;font-size:16px;font-weight:800}
.side-sec{font-size:13px;font-weight:700;color:var(--sub);margin:18px 0 8px}
.scard{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border:1px solid transparent}
.scard:hover{border-color:var(--line)}
.scard .st{font-weight:700;display:flex;align-items:flex-start;gap:8px;word-break:break-all}
.scard .ss{font-size:13px;color:var(--sub);margin:4px 0 0 16px;white-space:pre-wrap;word-break:break-all;line-height:1.5}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;display:inline-block}
.dot.ev{background:var(--ev-dot)} .dot.memo{background:var(--mm-dot)} .dot.dd{background:var(--dd-dot)}

/* 공통 버튼·태그 */
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;margin-right:6px;vertical-align:1px}
.tag.ev{background:var(--ev-bg);color:var(--ev-tx)} .tag.memo{background:var(--mm-bg);color:var(--mm-tx)} .tag.dd{background:var(--dd-bg);color:var(--dd-tx)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.pri{background:var(--text);color:var(--card)}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.warn{background:transparent;color:var(--sun);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* 메모 */
.mcard{background:var(--cell);border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;gap:12px;cursor:pointer;border:1px solid transparent}
.mcard:hover{border-color:var(--line)}
.mcard.done{opacity:.5}
.mcard.done .mtext{text-decoration:line-through}
.mcard .mtext{white-space:pre-wrap;word-break:break-all;line-height:1.55}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--sub);background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
.chk .ico{width:14px;height:14px;stroke-width:3}
.chk.on{background:var(--ev-dot);border-color:var(--ev-dot)}

/* D-day */
.dd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dcard{background:var(--cell);border-radius:16px;padding:16px;cursor:pointer;border:1px solid transparent}
.dcard:hover{border-color:var(--line)}
.dcard .dk{font-size:12px;color:var(--sub);font-weight:600}
.dcard .t{font-weight:700;margin-top:2px}
.dcard .big{font-size:30px;font-weight:800;margin:8px 0 2px;letter-spacing:-.8px}
.dcard .nx{margin-top:10px;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* 찾기 */
.search{position:relative;margin-bottom:14px}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub)}
.search input{padding-left:40px;background:var(--cell);border-color:transparent}
mark{background:var(--yellow);color:#000;border-radius:3px;padding:0 1px}

/* 입력바 */
.ask{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:30;padding:8px 12px;background:linear-gradient(to top,var(--bg) 65%,transparent)}
.ask-in{max-width:1200px;margin:0 auto;display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;box-shadow:0 6px 20px rgba(16,24,20,.10)}
.ask-in input{border:0;padding:8px 0;background:transparent;flex:1;min-width:0}
.mic{flex:none;width:42px;height:42px;border-radius:12px;border:0;background:var(--cell);display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.mic.on{background:var(--orange);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.send{flex:none;height:42px;border-radius:12px;border:0;background:var(--text);color:var(--card);font-weight:700;padding:0 16px}
@media (min-width:900px){ .ask{bottom:0;padding-bottom:16px} body{padding-bottom:100px} }

/* 미리보기 */
.preview{position:fixed;left:0;right:0;bottom:calc(124px + env(safe-area-inset-bottom));z-index:31;padding:0 12px;display:none}
@media (min-width:900px){ .preview{bottom:80px} }
.preview.show{display:block}
.preview .pv{max-width:1200px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(16,24,20,.18)}
.pv .sum{font-size:16px;font-weight:700;margin:0 0 4px;word-break:break-all}
.pv .hint{font-size:12px;color:var(--orange);margin:4px 0 0}
.pv .row{margin-top:12px}

/* 하단 탭 (폰) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;padding:8px 0 8px;color:var(--sub);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--text)}
.tabs button.on .ico{stroke-width:2.2}
@media (min-width:900px){ .tabs{display:none} }

/* 모달 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.4);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 14px;font-size:18px;font-weight:800}
.sheet .sec{background:var(--cell);border-radius:12px;padding:14px;margin-bottom:10px}
.sheet .sec h3{margin:0 0 8px;font-size:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px;font-weight:600}
.toast{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;font-weight:600;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}
.hidden{display:none!important}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="7" fill="#FFEB3B"/>
    <ellipse cx="32" cy="32" rx="27" ry="10" fill="none" stroke="#A5D6A7" stroke-width="3"/>
    <ellipse cx="32" cy="32" rx="27" ry="10" fill="none" stroke="#A5D6A7" stroke-width="3" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="27" ry="10" fill="none" stroke="#F57F17" stroke-width="3" transform="rotate(120 32 32)"/>
  </svg>
  <h1>김비서</h1>
  <nav id="topNav">
    <button data-tab="cal" class="on" onclick="showTab('cal')">달력</button>
    <button data-tab="memo" onclick="showTab('memo')">메모</button>
    <button data-tab="dday" onclick="showTab('dday')">D-day</button>
    <button data-tab="find" onclick="showTab('find')">찾기</button>
  </nav>
  <span class="today" id="topToday"></span>
  <button class="sync" id="syncState" onclick="openSettings()" title="로그인·동기화"><i></i><span>이 기기</span></button>
  <button class="icon-btn" onclick="openSettings()" aria-label="설정"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main class="wrap">
  <section id="tab-cal"></section>
  <section id="tab-memo" class="hidden"></section>
  <section id="tab-dday" class="hidden"></section>
  <section id="tab-find" class="hidden"></section>
</main>

<!-- 말하기·입력 미리보기 -->
<div class="preview" id="preview"><div class="pv" id="pvBox"></div></div>

<!-- 입력바 -->
<div class="ask">
  <form class="ask-in" onsubmit="event.preventDefault();onAsk();">
    <input id="askInput" autocomplete="off" placeholder="10월 16일 18시 면접 넣어줘">
    <button type="button" class="mic" id="micBtn" onclick="toggleMic()" aria-label="음성 입력"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button type="submit" class="send">입력</button>
  </form>
</div>

<nav class="tabs">
  <button data-tab="cal" class="on" onclick="showTab('cal')"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>달력</button>
  <button data-tab="memo" onclick="showTab('memo')"><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>메모</button>
  <button data-tab="dday" onclick="showTab('dday')"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>D-day</button>
  <button data-tab="find" onclick="showTab('find')"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>찾기</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   김비서 v1 — 화면 뼈대 + 이 기기 저장(localStorage)
   다음 단계: Supabase 동기화 · Claude 해석 · 아침 알림
   ========================================================= */

// ---------- 저장 (이 기기 + 로그인하면 서버 동기화) ----------
const STORE_KEY = 'kbs_data_v1';
let DB = loadDB();
function loadDB(){
  try{
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if(d && Array.isArray(d.items)){ if(!Array.isArray(d.dirty)) d.dirty = []; return d; }
  }catch(e){}
  return {ver:1, items:[], dirty:[], lastPull:null, syncUser:null};
}
function saveDB(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch(e){ toast('저장 실패 — 저장 공간을 확인해 주세요'); }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function markDirty(id){ if(!DB.dirty.includes(id)) DB.dirty.push(id); }
function upsert(item){
  item.updated = Date.now();
  const i = DB.items.findIndex(x => x.id === item.id);
  if(i >= 0) DB.items[i] = item; else { item.created = item.created || Date.now(); DB.items.push(item); }
  markDirty(item.id); saveDB(); render(); syncSoon();
}
// 삭제 = 지움 표시만 남김(다른 기기에도 지워지게)
function removeItem(id){

  Object.keys(x).forEach(k => { if(!['id','type','created'].includes(k)) delete x[k]; });
  x.deleted = true; x.updated = Date.now();
  markDirty(id); saveDB(); render(); syncSoon();
}
const live   = () => DB.items.filter(x => !x.deleted);
const events = () => live().filter(x => x.type === 'event');

// ---------- 날짜 도구 ----------
const DOW = ['일','월','화','수','목','금','토'];
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parseYmd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function todayYmd(){ return ymd(new Date()); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function dayDiff(a, b){ // b - a (일)
  const A = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  const B = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((B - A) / 86400000);
}
function fmtDate(s, withYear){
  const d = parseYmd(s);
  const y = (withYear || d.getFullYear() !== new Date().getFullYear()) ? d.getFullYear() + '년 ' : '';
  return y + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')';
}
function fmtTime(t){
  if(!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ap = h < 12 ? '오전' : '오후';
  const hh = h % 12 === 0 ? 12 : h % 12;
  return ap + ' ' + hh + '시' + (m ? ' ' + m + '분' : '');
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- D-day 계산 ----------
// kind: since = 그날부터 N일째(1일부터 셈) / until = 그날까지 D-N / yearly = 매년 반복
function ddayInfo(x){
  const today = parseYmd(todayYmd());
  const base = parseYmd(x.date);
  if(x.kind === 'since'){
    const n = dayDiff(base, today) + 1;
    if(n < 1) return {big: 'D-' + (1 - n), sub: fmtDate(x.date, true) + ' 시작', soon: 1 - n, next: null};
    // 다음 기념: 100일 단위 또는 N주년 중 가까운 것
    const next100 = Math.ceil((n + (n % 100 === 0 ? 0 : 0)) / 100) * 100;
    const cand = [];
    const n100 = n % 100 === 0 ? n : next100;
    cand.push({label: n100 + '일', date: addDays(base, n100 - 1)});
    let yr = today.getFullYear() - base.getFullYear();
    let ann = new Date(base.getFullYear() + yr, base.getMonth(), base.getDate());
    if(ann < today) ann = new Date(base.getFullYear() + (++yr), base.getMonth(), base.getDate());
    if(yr >= 1) cand.push({label: yr + '주년', date: ann});
    cand.sort((a, b) => a.date - b.date);
    const nx = cand[0];
    const left = dayDiff(today, nx.date);
    return {big: n.toLocaleString() + '일째', sub: fmtDate(x.date, true) + ' 부터',
            next: nx.label + ' · ' + fmtDate(ymd(nx.date), true) + (left === 0 ? ' · 오늘!' : ' · D-' + left), soon: left};
  }
  if(x.kind === 'yearly'){
    let nx = new Date(today.getFullYear(), base.getMonth(), base.getDate());
    if(nx < today) nx = new Date(today.getFullYear() + 1, base.getMonth(), base.getDate());
    const left = dayDiff(today, nx);
    const times = nx.getFullYear() - base.getFullYear();
    return {big: left === 0 ? '오늘!' : 'D-' + left, sub: '매년 ' + (base.getMonth()+1) + '월 ' + base.getDate() + '일',
            next: fmtDate(ymd(nx), true) + (times > 0 ? ' · ' + times + '번째' : ''), soon: left};
  }
  // until
  const left = dayDiff(today, base);
  return {big: left === 0 ? 'D-DAY' : (left > 0 ? 'D-' + left : 'D+' + (-left)), sub: fmtDate(x.date, true), next: null, soon: left >= 0 ? left : 9999};
}

// ---------- 말 → 일정/메모 해석 (1단계: 규칙 기반, 2단계에서 Claude로 보강) ----------
const WD = {'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
function parseCommand(raw){
  let t = ' ' + raw.trim().replace(/\s+/g, ' ') + ' ';
  const now = new Date(); const today = parseYmd(ymd(now));
  let date = null, time = null, notes = [];
  let intent = null;

  // 찾기 의도
  if(/(찾아\s*(줘|봐|주세요)?|검색해?\s*(줘)?|있었나|있었지|언제였지|뭐였지|뭐더라|어디였지)\s*[?？.]?\s*$/.test(t.trim())){
    intent = 'find';
  }
  // 메모 의도
  if(/메모\s*(해\s*줘|해줘|해 줘|좀|해)?|기억해\s*(줘)?|적어\s*(줘|둬)/.test(t)) intent = intent || 'memo';
  if(/(일정|스케(줄|쥴))/.test(t) && intent !== 'find') intent = 'event';

  const take = re => { const m = t.match(re); if(m){ t = t.replace(m[0], ' '); } return m; };
  let m;

  // 날짜: 2026-10-16 / 2026.10.16 / 2026년 10월 16일
  if(m = take(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})\s*일?/)){
    date = new Date(+m[1], +m[2]-1, +m[3]);
  } else if(m = take(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/)){
    date = new Date(today.getFullYear(), +m[1]-1, +m[2]);
    if(dayDiff(date, today) > 60){ date.setFullYear(date.getFullYear()+1); notes.push('내년으로 이해'); }
  } else if(m = take(/(?:^|\s)(\d{1,2})\/(\d{1,2})(?=\s)/)){
    date = new Date(today.getFullYear(), +m[1]-1, +m[2]);
    if(dayDiff(date, today) > 60){ date.setFullYear(date.getFullYear()+1); notes.push('내년으로 이해'); }
  } else if(m = take(/(\d{1,3})\s*일\s*(뒤|후)에?/)){
    date = addDays(today, +m[1]);
  } else if(m = take(/(내일\s*모레|글피|모레|내일|오늘)/)){
    const k = m[1].replace(/\s/g,'');
    date = addDays(today, {'오늘':0,'내일':1,'모레':2,'내일모레':2,'글피':3}[k]);
  } else if(m = take(/(이번\s*주|다음\s*주|담\s*주|다다음\s*주)?\s*([월화수목금토일])\s*요일/)){
    const target = WD[m[2]];
    const w = (m[1] || '').replace(/\s/g,'');
    if(w){
      const mon = addDays(today, -((today.getDay() + 6) % 7)); // 이번 주 월요일
      const off = (target + 6) % 7; // 월=0 … 일=6
      const add = w === '이번주' ? 0 : (w === '다다음주' ? 14 : 7);
      date = addDays(mon, off + add);
    } else {
      let diff = (target - today.getDay() + 7) % 7;
      date = addDays(today, diff);
    }
  } else if(m = take(/(?:^|\s)(\d{1,2})\s*일(?=\s|에|날)/)){
    date = new Date(today.getFullYear(), today.getMonth(), +m[1]);
    if(date < today){ date = new Date(today.getFullYear(), today.getMonth()+1, +m[1]); notes.push('다음 달로 이해'); }
  }

  // 시간: 18:30 / 오후 3시 반 / 저녁 7시 20분 / 정오
  if(m = take(/(\d{1,2}):(\d{2})/)){
    time = pad(+m[1]) + ':' + m[2];
  } else if(m = take(/(오전|오후|아침|점심|저녁|밤|낮|새벽)?\s*(\d{1,2})\s*시(?!간)\s*(반|(\d{1,2})\s*분)?/)){
    let h = +m[2]; const mi = m[3] === '반' ? 30 : (m[4] ? +m[4] : 0);
    const ap = m[1] || '';
    if(/오후|저녁|밤|점심|낮/.test(ap) && h < 12) h += 12;
    if(/밤/.test(ap) && h === 24) h = 0;
    if(!ap && h >= 1 && h <= 7){ h += 12; notes.push('오후로 이해'); }
    time = pad(h % 24) + ':' + pad(mi);
  } else if(m = take(/정오/)){ time = '12:00'; }

  // 명령어 꼬리 정리
  let title = t
    .replace(/^\s*(메모|기억|적어)\s*(해|좀)?\s*(줘|둬|주세요)?\s*[:,]?\s+/,' ')
    .replace(/(을|를)?\s*(일정\s*(으로|에)?\s*)?(입력|추가|등록|저장|넣어|기록|잡아|메모|적어|기억)\s*(해|하)?\s*(줘|주세요|줄래|둬|놔|라)?\s*[.!?？]*\s*$/,' ')
    .replace(/(찾아\s*(줘|봐|주세요)?|검색해?\s*(줘)?|있었나|있었지|언제였지|뭐였지|뭐더라|어디였지)\s*[?？.]?\s*$/,' ')
    .replace(/(^|\s)(일정|스케줄|스케쥴|메모)(\s|$)/g,' ')
    .replace(/^\s*(에|에는|은|는)\s+/,' ')
    .replace(/\s(에|에는)\s/g,' ')
    .replace(/\s+/g,' ').trim();

  if(intent === 'find') return {kind:'find', query: title || raw.trim()};
  if(!title) title = raw.trim();
  if(date && intent !== 'memo'){
    return {kind:'event', date: ymd(date), time, title, notes};
  }
  return {kind:'memo', text: title, date: date ? ymd(date) : null, notes};
}

}
function fmtDateLong(s){ const d = parseYmd(s); return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + DOW[d.getDay()] + '요일'; }

// ---------- 달력 ----------
function itemsOnDate(s){
  const ev = events().filter(x => x.date === s).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
  const mm = memos().filter(x => x.date === s);
  return {ev, mm};
}
function ddaysOnDate(s){ // 그날이 기념일인 D-day
  const d = parseYmd(s); const out = [];
  ddays().forEach(x => {
    const b = parseYmd(x.date);
    if(x.kind === 'until' && x.date === s) out.push({x, label: x.title});
    if(x.kind === 'yearly' && b.getMonth() === d.getMonth() && b.getDate() === d.getDate() && d >= b) out.push({x, label: x.title});
    if(x.kind === 'since'){
      const n = dayDiff(b, d) + 1;
      if(n > 1 && n % 100 === 0) out.push({x, label: x.title + ' ' + n + '일'});
      if(d > b && b.getMonth() === d.getMonth() && b.getDate() === d.getDate()) out.push({x, label: x.title + ' ' + (d.getFullYear() - b.getFullYear()) + '주년'});
    }
  });
  return out;
}

const DD_KIND = {since:'그날부터', until:'남은 날', yearly:'매년'};

    h += '<div class="dcard" onclick="editDday(\'' + x.id + '\')">'
      + '<div class="dk">' + DD_KIND[x.kind || 'since'] + '</div>'
      + '<div class="t">' + esc(x.title) + '</div><div class="big">' + esc(i.big) + '</div>'
      + '<div class="muted">' + esc(i.sub) + '</div>'
      + (i.next ? '<div class="nx"><span class="tag dd">다음</span>' + esc(i.next) + '</div>' : '') + '</div>';
  });
  document.getElementById('tab-dday').innerHTML = h + '</div></div>';
}

// ---------- 찾기 (1단계: 글자 일치, 2단계에서 Claude로 '비슷한 뜻' 찾기) ----------
function normalizeKo(s){ return String(s || '').toLowerCase().replace(/\s+/g, ''); }
function searchItems(q){
  const words = q.split(/\s+/).map(w => w.replace(/(이랑|하고|에서|으로|에게|한테|은|는|이|가|을|를|에|도|랑|의|로)$/,'')).filter(w => w.length >= 1);
  if(!words.length) return [];
  const res = [];
  live().forEach(x => {
    const text = x.type === 'memo' ? x.text : (x.title + ' ' + (x.note || ''));
    const n = normalizeKo(text);
    let score = 0;
    words.forEach(w => { const nw = normalizeKo(w); if(!nw) return; if(n.includes(nw)) score += 2; else if(nw.length >= 2 && [...nw].filter(c => n.includes(c)).length >= Math.ceil(nw.length * 0.7)) score += 1; });
    if(score) res.push({x, score});
  });
  return res.sort((a, b) => b.score - a.score || (b.x.updated || 0) - (a.x.updated || 0));
}
function hl(text, q){
  let h = esc(text);
  q.split(/\s+/).filter(w => w.length >= 1).forEach(w => {
    const ww = esc(w.replace(/(이랑|하고|에서|으로|은|는|이|가|을|를|에|도|랑|의|로)$/,''));
    if(ww) h = h.split(ww).join('<mark>' + ww + '</mark>');
  });
  return h;
}
function renderFind(){
  let h = '<div class="panel">' + panelHead('찾기', '일정·메모·D-day를 한 번에 찾아요.')
    + '<div class="row" style="flex-wrap:nowrap;margin-bottom:14px"><div class="search" style="flex:1;margin:0">' + IC.search
    + '<input id="findInput" placeholder="기억나는 말 (예: 지게차 얘기, 명함)" value="' + esc(findQ) + '" oninput="findQ=this.value;renderFindResults()" onkeydown="if(event.key===\'Enter\')runAiSearch(false)"></div>'
    + (SESSION ? '<button class="btn pri" onclick="runAiSearch(false)">찾기</button>' : '')
    + '</div><div id="findRes"></div></div>';
  document.getElementById('tab-find').innerHTML = h;
  renderFindResults();
}
let aiFind = {q:'', busy:false, answer:'', ids:[], failed:false};
function findCard(x, q){
  if(x.type === 'event') return '<div class="mcard" onclick="editEvent(\'' + x.id + '\')"><div style="flex:1;min-width:0"><div><span class="tag ev">일정</span><span class="muted">' + fmtDate(x.date) + (x.time ? ' ' + fmtTime(x.time) : '') + '</span></div><div class="mtext" style="font-weight:700;margin-top:4px">' + hl(x.title, q) + '</div>' + (x.note ? '<div class="mtext muted">' + hl(x.note, q) + '</div>' : '') + '</div></div>';
  if(x.type === 'memo') return '<div class="mcard" onclick="editMemo(\'' + x.id + '\')"><div style="flex:1;min-width:0"><div><span class="tag memo">메모</span><span class="muted">' + (x.date ? fmtDate(x.date) + ' · ' : '') + new Date(x.created).toLocaleDateString('ko-KR') + '</span></div><div class="mtext" style="margin-top:4px">' + hl(x.text, q) + '</div></div></div>';
  return '<div class="mcard" onclick="editDday(\'' + x.id + '\')"><div style="flex:1;min-width:0"><div><span class="tag dd">D-day</span><span class="muted">' + fmtDate(x.date, true) + '</span></div><div class="mtext" style="font-weight:700;margin-top:4px">' + hl(x.title, q) + '</div></div></div>';
}
function renderFindResults(){
  const box = document.getElementById('findRes'); if(!box) return;
  const q = findQ.trim();
  if(!q){ box.innerHTML = '<div class="empty">입력칸에 "지게차 얘기 언제였지?"라고 해도 돼요.' + (SESSION ? '' : '<br><span class="muted">로그인하면 비슷한 뜻으로도 찾아요.</span>') + '</div>'; return; }
  let h = '';
  const shown = new Set();
  if(aiFind.q === q){
    if(aiFind.busy) h += '<div class="aibox">비슷한 뜻으로 찾는 중…</div>';
    else if(aiFind.failed) h += '<div class="aibox" style="background:var(--cell);color:var(--sub)">비슷한 뜻 찾기에 실패했어요 — 글자가 같은 기록만 보여 드려요.</div>';
    else {
      h += '<div class="aibox">' + esc(aiFind.answer) + '</div>';
      aiFind.ids.forEach(id => { const x = live().find(i => i.id === id); if(x){ shown.add(id); h += findCard(x, q); } });
    }
  }
  const r = searchItems(q).filter(o => !shown.has(o.x.id));
  if(r.length){
    if(shown.size || aiFind.q === q) h += '<div class="find-sec">글자가 같은 기록 ' + r.length + '건</div>';
    else h += '<div class="muted" style="margin-bottom:8px">' + r.length + '건' + (SESSION ? ' · Enter를 누르면 비슷한 뜻까지 찾아요' : '') + '</div>';
    r.forEach(({x}) => h += findCard(x, q));
  }
  if(!h) h = '<div class="empty">"' + esc(q) + '" — 찾지 못했어요.' + (SESSION ? '<br><span class="muted">Enter를 누르면 비슷한 뜻까지 찾아요.</span>' : '<br><span class="muted">로그인하면 비슷한 뜻으로도 찾아요.</span>') + '</div>';
  box.innerHTML = h;
}
async function runAiSearch(fromVoice){
  const q = findQ.trim(); if(!q) return;
  if(!SESSION){
    if(fromVoice){ const n = searchItems(q).length; speak(n ? q + ', ' + n + '건 찾았어요.' : q + ', 찾지 못했어요.'); }
    return;
  }
  aiFind = {q, busy:true, answer:'', ids:[], failed:false}; renderFindResults();
  const typeName = {event:'일정', memo:'메모', dday:'D-day'};
  const items = live().slice().sort((a, b) => (b.updated || 0) - (a.updated || 0)).slice(0, 600)
    .map(x => x.id + '|' + typeName[x.type] + '|' + (x.date || '') + (x.time ? ' ' + x.time : '') + '|' + String(x.type === 'memo' ? x.text : x.title + (x.note ? ' — ' + x.note : '')).replace(/\s+/g, ' ').slice(0, 150));
  const res = await aiCall({action:'search', query:q, items}, 15000);
  if(findQ.trim() !== q) return;
  aiFind = res ? {q, busy:false, answer: String(res.answer || ''), ids: Array.isArray(res.ids) ? res.ids : [], failed:false} : {q, busy:false, answer:'', ids:[], failed:true};
  if(TAB === 'find') renderFindResults();
  if(fromVoice){
    if(res) speak(aiFind.answer);
    else { const n = searchItems(q).length; speak(n ? q + ', ' + n + '건 찾았어요.' : q + ', 찾지 못했어요.'); }
  }
}

    }catch(e){ toast('김비서 백업 파일이 아니에요'); }

}

// ---------- 입력 → 해석(로그인 시 Claude, 실패하면 규칙) → 미리보기 → 저장 ----------
let PENDING = null, pvTimer = null, askSeq = 0;
function todayContext(){
  const n = new Date();
  return todayYmd() + ' (' + DOW[n.getDay()] + '요일) ' + pad(n.getHours()) + ':' + pad(n.getMinutes());
}
// Claude 결과 검증 → 미리보기 형식. 이상하면 null(규칙 해석으로)
function fromAi(a, raw){
  if(!a || typeof a !== 'object') return null;
  const okDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '') && !isNaN(parseYmd(v).getTime());
  const okTime = v => /^([01]\d|2[0-3]):[0-5]\d$/.test(v || '');
  const notes = a.note ? [String(a.note).slice(0, 80)] : [];
  const str = v => (typeof v === 'string' ? v.trim() : '');
  if(a.kind === 'find' && str(a.query)) return {kind:'find', query: str(a.query)};
  if(a.kind === 'event' && okDate(a.date) && str(a.title)) return {kind:'event', date:a.date, time: okTime(a.time) ? a.time : null, title: str(a.title), notes};
  if(a.kind === 'dday' && okDate(a.date) && str(a.title)) return {kind:'dday', date:a.date, title: str(a.title), ddKind: ['since','until','yearly'].includes(a.dday_kind) ? a.dday_kind : 'since', notes};
  if(a.kind === 'memo') return {kind:'memo', text: str(a.text) || raw, date: okDate(a.date) ? a.date : null, notes};
  return null;
}
async function onAsk(fromVoice){
  const inp = document.getElementById('askInput');
  const text = inp.value.trim(); if(!text) return;
  const seq = ++askSeq;
  clearInterval(pvTimer);
  let p = null;
  if(SESSION && navigator.onLine){
    document.getElementById('pvBox').innerHTML = '<div class="sum">' + esc(text) + '</div><div class="muted">알아듣는 중…</div><div class="row"><button class="btn sec" onclick="cancelPending()">취소</button></div>';
    document.getElementById('preview').classList.add('show');
    p = fromAi(await aiCall({action:'parse', text, today: todayContext()}, 7000), text);
    if(seq !== askSeq) return; // 그사이 취소·새 입력
  }
  if(!p) p = parseCommand(text);
  if(p.kind === 'find'){
    document.getElementById('preview').classList.remove('show');
    findQ = p.query; inp.value = ''; showTab('find');
    runAiSearch(fromVoice);
    return;
  }
  PENDING = p; showPreview(fromVoice);
}
function pvSummary(p){
  if(p.kind === 'event') return fmtDate(p.date) + (p.time ? ' ' + fmtTime(p.time) : ' 종일') + ' · ' + p.title;
  if(p.kind === 'dday') return p.title + ' · ' + fmtDate(p.date, true) + ' · ' + DD_KIND[p.ddKind || 'since'];
  return p.text + (p.date ? ' (' + fmtDate(p.date) + ')' : '');
}
function speakSummary(p){
  if(p.kind === 'event'){
    const d = parseYmd(p.date);
    return (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + DOW[d.getDay()] + '요일 ' + (p.time ? fmtTime(p.time) + ' ' : '') + p.title + ', 일정에 넣을게요.';
  }
  if(p.kind === 'dday'){
    const d = parseYmd(p.date);
    return p.title + ', ' + d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일, 디데이로 등록할게요.';
  }
  return '메모할게요. ' + p.text;
}
function showPreview(fromVoice){
  const p = PENDING;
  clearInterval(pvTimer);
  const tag = {event:'<span class="tag ev">일정</span>', memo:'<span class="tag memo">메모</span>', dday:'<span class="tag dd">D-day</span>'}[p.kind];
  let h = '<div class="sum">' + tag + esc(pvSummary(p)) + '</div>';
  if(p.notes && p.notes.length) h += '<div class="hint">' + esc(p.notes.join(' · ')) + '</div>';
  h += '<div class="row"><button class="btn pri" id="pvSave" onclick="confirmPending()">저장</button>'
     + (p.kind === 'event' ? '<button class="btn sec" onclick="pendingAs(\'memo\')">메모로</button>' : p.kind === 'memo' ? '<button class="btn sec" onclick="pendingAs(\'event\')">일정으로</button>' : '')
     + '<button class="btn sec" onclick="pendingEdit()">고치기</button>'
     + '<button class="btn sec" onclick="cancelPending()">취소</button></div>';
  document.getElementById('pvBox').innerHTML = h;
  document.getElementById('preview').classList.add('show');
  if(fromVoice){
    // 운전 중: 화면을 안 봐도 되게 읽어 주고 8초 뒤 자동 저장 (취소 누르면 멈춤)
    speak(speakSummary(p) + ' 취소하려면 취소를 누르세요.');
    let left = 8;
    const btn = document.getElementById('pvSave');
    btn.textContent = '저장 (' + left + ')';
    pvTimer = setInterval(() => {
      left--;
      if(left <= 0){ clearInterval(pvTimer); confirmPending(); }
      else if(btn) btn.textContent = '저장 (' + left + ')';
    }, 1000);
  }
}
function pendingAs(kind){
  clearInterval(pvTimer);
  const p = PENDING; if(!p) return;
  if(kind === 'memo') PENDING = {kind:'memo', text: p.title || p.text, date: p.date || null, notes: []};
  else{
    if(!p.date){ PENDING = p; pendingEdit('event'); return; }
    PENDING = {kind:'event', date: p.date, time: null, title: p.text, notes: []};
  }
  showPreview(false);
}
function pendingEdit(forceKind){
  clearInterval(pvTimer);
  const p = PENDING; if(!p) return;
  cancelPending(true);
  if(!forceKind && p.kind === 'dday'){
    editDday(null);
    document.getElementById('f_dtitle').value = p.title;
    document.getElementById('f_ddate').value = p.date;
    document.getElementById('f_dkind').value = p.ddKind || 'since';
  } else if((forceKind || p.kind) === 'event'){
    editEvent(null, p.date || selDate);
    document.getElementById('f_title').value = p.title || p.text || '';
    if(p.time) document.getElementById('f_time').value = p.time;
  } else {
    editMemo(null, p.date);
    document.getElementById('f_text').value = p.text;
  }
}
function confirmPending(){
  clearInterval(pvTimer);
  const p = PENDING; if(!p) return;
  if(p.kind === 'event'){
    upsert({id: uid(), type:'event', date: p.date, time: p.time || null, title: p.title, note: '', src: 'ask'});
    selectDate(p.date);
    if(TAB !== 'cal') showTab('cal');
  } else if(p.kind === 'dday'){
    upsert({id: uid(), type:'dday', title: p.title, date: p.date, kind: p.ddKind || 'since', src: 'ask'});
    if(TAB !== 'dday') showTab('dday');
  } else {
    upsert({id: uid(), type:'memo', text: p.text, date: p.date || null, done: false, src: 'ask'});
  }
  toast('저장했어요 · ' + pvSummary(p));
  cancelPending(true);
}
function cancelPending(silent){
  clearInterval(pvTimer);
  askSeq++;
  PENDING = null;
  document.getElementById('preview').classList.remove('show');
  document.getElementById('askInput').value = '';
  if(!silent){ try{ speechSynthesis.cancel(); }catch(e){} toast('취소했어요'); }
}

// ---------- 음성 (Chrome 음성인식 · 읽어 주기) ----------
let REC = null, recOn = false;
function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function toggleMic(){
  if(recOn){ try{ REC.stop(); }catch(e){} return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('이 브라우저는 음성 입력을 지원하지 않아요 — 키보드 마이크(Wispr Flow)를 써 주세요'); document.getElementById('askInput').focus(); return; }
  REC = new SR();
  REC.lang = 'ko-KR'; REC.interimResults = true; REC.continuous = false;
  const inp = document.getElementById('askInput');
  let finalText = '';
  REC.onstart = () => { recOn = true; document.getElementById('micBtn').classList.add('on'); inp.placeholder = '듣고 있어요… 말씀하세요'; };
  REC.onresult = e => {
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal) finalText += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
    }
    inp.value = (finalText + interim).trim();
  };
  REC.onerror = e => {
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('마이크 권한을 허용해 주세요');
    else if(e.error === 'no-speech') toast('말씀이 안 들렸어요');
    else if(e.error === 'network') toast('음성 인식은 인터넷이 필요해요');
  };
  REC.onend = () => {
    recOn = false; document.getElementById('micBtn').classList.remove('on');
    inp.placeholder = '10월 16일 18시 면접 넣어줘';
    if(inp.value.trim()) onAsk(true);
  };
  try{ REC.start(); }catch(e){ toast('마이크를 시작하지 못했어요'); }
}

// ---------- 서버 (Supabase: 본인 로그인 · PC↔폰 동기화 · Claude) ----------
// 공개용 주소·키 — 실제 보호는 DB 권한 규칙(RLS: 본인 기록만)
const SB_URL = 'https://bqyepkbajnnguhhcixfv.supabase.co';
const SB_KEY = 'sb_publishable_AwVceidlNTz43YGKsIwh0w_G5X0g5kS';
const SB_LIB = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';
let SB = null, SESSION = null, syncing = false, syncT = null, lastSyncAt = 0, syncErr = '';
function sbLoad(){
  if(window.supabase) return sbInit();
  const sc = document.createElement('script');
  sc.src = SB_LIB; sc.async = true;
  sc.onload = sbInit;
  sc.onerror = () => { syncErr = '서버 연결 도구를 불러오지 못했어요 (인터넷 확인)'; updateSyncBadge(); };
  document.head.appendChild(sc);
}
function sbInit(){
  if(SB || !window.supabase) return;
  try{
    SB = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true, storageKey: 'kbs_auth'}});
  }catch(e){ SB = null; syncErr = '서버 연결 실패'; updateSyncBadge(); return; }
  SB.auth.getSession().then(({data}) => { SESSION = data.session || null; onAuthChanged(); });
  SB.auth.onAuthStateChange((ev, sess) => {
    const before = SESSION ? SESSION.user.id : null;
    SESSION = sess || null;
    if((SESSION ? SESSION.user.id : null) !== before) onAuthChanged();
  });
}
function onAuthChanged(){
  if(SESSION && DB.syncUser !== SESSION.user.id){
    // 이 계정으로 처음 동기화: 이 기기 기록을 전부 올리고 서버 기록을 처음부터 받음
    DB.syncUser = SESSION.user.id; DB.lastPull = null;
    DB.items.forEach(x => markDirty(x.id));
    saveDB();
  }
  updateSyncBadge();
  if(SESSION) syncNow();
  render();
}
function syncSoon(){ if(!SESSION) return; clearTimeout(syncT); syncT = setTimeout(syncNow, 1200); }
function mergeRemote(r){
  const it = Object.assign({}, r.data || {}, {id: r.id, type: r.type, updated: Number(r.updated) || 0});
  if(r.deleted) it.deleted = true; else delete it.deleted;
  const i = DB.items.findIndex(x => x.id === r.id);
  if(i < 0) DB.items.push(it);
  else if(it.updated > (DB.items[i].updated || 0)) DB.items[i] = it;
}
async function syncNow(){
  if(!SB || !SESSION || syncing) return;
  if(!navigator.onLine){ syncErr = '오프라인 — 연결되면 자동으로 맞춰요'; updateSyncBadge(); return; }
  syncing = true; updateSyncBadge();
  try{
    // 1) 이 기기에서 고친 것 올리기
    const snap = {};
    DB.dirty.forEach(id => { const x = DB.items.find(i => i.id === id); if(x) snap[id] = x.updated || 0; });
    const rows = Object.keys(snap).map(id => { const x = DB.items.find(i => i.id === id); return {id, type: x.type, data: x, updated: x.updated || 0, deleted: !!x.deleted}; });
    for(let i = 0; i < rows.length; i += 200){
      const {data, error} = await SB.from('kbs_items').upsert(rows.slice(i, i + 200), {onConflict: 'id'}).select('id,type,data,updated,deleted,server_at');
      if(error) throw error;
      (data || []).forEach(mergeRemote); // 서버에 더 최신이 있으면 그걸로
    }
    // 올리는 사이 다시 고친 것은 남겨 둠
    DB.dirty = DB.dirty.filter(id => { const x = DB.items.find(i => i.id === id); return !(id in snap) || (x && (x.updated || 0) > snap[id]); });
    // 2) 다른 기기에서 고친 것 받기 (서버 시각 기준, 5초 겹쳐 읽기)
    for(let page = 0; page < 20; page++){
      let q = SB.from('kbs_items').select('id,type,data,updated,deleted,server_at').order('server_at', {ascending: true}).limit(1000);
      if(DB.lastPull) q = q.gt('server_at', new Date(new Date(DB.lastPull).getTime() - 5000).toISOString());
      const {data, error} = await q;
      if(error) throw error;
      (data || []).forEach(mergeRemote);
      if(!data || !data.length) break;
      const last = data[data.length - 1].server_at;
      if(DB.lastPull && new Date(last) <= new Date(DB.lastPull)) break;
      DB.lastPull = last;
      if(data.length < 1000) break;
    }
    saveDB(); lastSyncAt = Date.now(); syncErr = '';
    render();
  }catch(e){
    syncErr = (e && e.message) ? '동기화 실패: ' + e.message : '동기화 실패';
  }finally{
    syncing = false; updateSyncBadge();
  }
}
function updateSyncBadge(){
  const el = document.getElementById('syncState'); if(!el) return;
  let cls = '', txt = '이 기기';
  if(SESSION){
    if(syncing){ cls = 'busy'; txt = '맞추는 중'; }
    else if(syncErr){ cls = 'err'; txt = navigator.onLine ? '동기화 오류' : '오프라인'; }
    else { cls = 'ok'; txt = DB.dirty.length ? '대기 ' + DB.dirty.length : '동기화됨'; }
  }
  el.className = 'sync ' + cls;
  el.querySelector('span').textContent = txt;
}
function accountHtml(){
  let h = '<div class="sec"><h3>계정 · 동기화</h3>';
  if(!SB){
    h += '<div class="muted">' + esc(syncErr || '서버에 연결하는 중…') + '</div></div>';
    return h;
  }
  if(!SESSION){
    return h + '<div class="muted" style="margin-bottom:10px">로그인하면 PC·폰이 자동으로 맞춰지고, Claude가 말을 알아듣고 비슷한 뜻으로도 찾아줘요.</div>'
      + '<div class="field"><input id="f_email" type="email" autocomplete="username" placeholder="이메일"></div>'
      + '<div class="field"><input id="f_pw" type="password" autocomplete="current-password" placeholder="비밀번호" onkeydown="if(event.key===\'Enter\')sbLogin()"></div>'
      + '<button class="btn pri" style="width:100%" onclick="sbLogin()">로그인</button></div>';
  }
  const t = lastSyncAt ? new Date(lastSyncAt).toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'}) : '—';
  return h + '<div style="font-weight:700">' + esc(SESSION.user.email || '') + '</div>'
    + '<div class="muted" style="margin:4px 0 10px">마지막 동기화 ' + t + (DB.dirty.length ? ' · 올릴 것 ' + DB.dirty.length + '개' : '') + '</div>'
    + (syncErr ? '<div class="muted" style="color:var(--sun);margin-bottom:10px">' + esc(syncErr) + '</div>' : '')
    + '<div class="row"><button class="btn sec sm" onclick="syncNow().then(openSettings)">지금 동기화</button><button class="btn sec sm" onclick="sbLogout()">로그아웃</button></div></div>';
}
async function sbLogin(){
  if(!SB) return;
  const email = val('f_email'), password = document.getElementById('f_pw').value;
  if(!email || !password){ toast('이메일과 비밀번호를 넣어 주세요'); return; }
  const {error} = await SB.auth.signInWithPassword({email, password});
  if(error){ toast(/invalid/i.test(error.message) ? '이메일 또는 비밀번호가 맞지 않아요' : '로그인 실패: ' + error.message); return; }
  toast('로그인했어요 — 기록을 맞추는 중'); openSettings();
}
async function sbLogout(){
  if(!SB || !confirm('로그아웃할까요? 이 기기 기록은 그대로 남아요.')) return;
  await SB.auth.signOut(); toast('로그아웃했어요'); openSettings();
}
// Claude 호출 (Edge Function kbs-ai). 실패·시간 초과면 null
async function aiCall(body, ms){
  if(!SB || !SESSION || !navigator.onLine) return null;
  try{
    const r = await Promise.race([
      SB.functions.invoke('kbs-ai', {body}),
      new Promise(res => setTimeout(() => res({timeout: true}), ms || 8000))
    ]);
    if(!r || r.timeout || r.error || !r.data || !r.data.result) return null;
    return r.data.result;
  }catch(e){ return null; }
}

// ---------- 공통 ----------
let toastT = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeModal(); } });
let rsT = null; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(render, 150); });
document.addEventListener('visibilitychange', () => { if(!document.hidden){ render(); syncNow(); } }); // 날짜 넘어가면 갱신 + 다른 기기 변경 받기
window.addEventListener('online', () => { syncErr = ''; syncNow(); });
setInterval(() => { if(!document.hidden) syncNow(); }, 60000);

// ---------- 시작 ----------
applyTheme();
render();
sbLoad();
// 빅스비 빠른 명령어 등으로 ?voice=1 주소를 열면 바로 듣기 시도 (브라우저가 막으면 마이크 버튼 안내)
if(/[?&]voice=1/.test(location.search)){
  setTimeout(() => { try{ toggleMic(); }catch(e){} }, 400);
}
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
